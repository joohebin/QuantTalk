<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuantTalk - 量化交易社交平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{scrollbar-width:thin;scrollbar-color:#334155 transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
body{background:#060a14;color:#e2e8f0;font-family:'Inter',sans-serif;margin:0}
.glass{background:rgba(20,28,46,.85);backdrop-filter:blur(12px);border:1px solid rgba(100,116,139,.15)}
.glass2{background:rgba(30,41,59,.6);border:1px solid rgba(100,116,139,.1)}
.tag{background:rgba(14,165,233,.12);color:#38bdf8;border:1px solid rgba(14,165,233,.2);border-radius:9999px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none;color:#fff}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7)}.btn-primary:hover{box-shadow:0 4px 14px rgba(14,165,233,.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#94a3b8;border:1px solid #334155}.btn-ghost:hover{color:#fff;border-color:#475569}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.25)}
.gain{color:#22c55e}.loss{color:#ef4444}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}
.avatar-sm{width:28px;height:28px;font-size:11px}
.avatar-lg{width:56px;height:56px;font-size:22px}
.input{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:13px;outline:none;transition:border .2s}
.input:focus{border-color:#0ea5e9;box-shadow:0 0 0 2px rgba(14,165,233,.15)}
.fade-in{animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#141c2e;border:1px solid rgba(100,116,139,.2);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px}
.toast-wrap{position:fixed;top:70px;right:16px;z-index:200}
.toast{padding:10px 18px;border-radius:10px;color:#fff;font-size:13px;margin-bottom:8px;animation:fadeIn .2s}
.badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.divider{height:1px;background:rgba(100,116,139,.12);margin:12px 0}
</style>
</head>
<body>
<!-- NAV -->
<nav class="glass sticky top-0 z-50" style="border-bottom:1px solid rgba(100,116,139,.1)">
<div class="max-w-[1200px] mx-auto px-4 h-14 flex items-center justify-between">
<div class="flex items-center gap-6">
<a href="#" onclick="nav('feed')" class="flex items-center gap-2 text-lg font-bold text-white no-underline"><span style="color:#38bdf8">⚡</span>QuantTalk</a>
<div class="hidden md:flex items-center gap-1" id="nav-links"></div>
</div>
<div class="flex items-center gap-3" id="nav-right"></div>
</div>
</nav>

<!-- MAIN -->
<div class="max-w-[1200px] mx-auto px-4 py-5 flex gap-5">
<!-- LEFT SIDEBAR -->
<aside class="hidden lg:block w-[240px] flex-shrink-0 space-y-4" id="sidebar-l"></aside>
<!-- CENTER -->
<div class="flex-1 min-w-0" id="app"></div>
<!-- RIGHT SIDEBAR -->
<aside class="hidden xl:block w-[260px] flex-shrink-0 space-y-4" id="sidebar-r"></aside>
</div>

<!-- MODAL -->
<div id="modal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal fade-in" id="modal-body"></div>
</div>
<!-- TOASTS -->
<div class="toast-wrap" id="toasts"></div>

<script>
const S={token:localStorage.getItem('qt_token')||'',user:JSON.parse(localStorage.getItem('qt_user')||'null'),page:'feed',ws:null,channelId:null,communityId:null};
const A='/api';

// ===== UTILS =====
async function api(p,o={}){
const h={'Content-Type':'application/json',...(o.headers||{})};
if(S.token)h.Authorization='Bearer '+S.token;
const r=await fetch(A+p,{...o,headers:h});
if(r.status===401&&!p.includes('/auth/')){doLogout();return null}
return r.json();
}
function toast(msg,type='info'){const c={info:'#0ea5e9',success:'#22c55e',error:'#ef4444'};const d=document.createElement('div');d.className='toast';d.style.background=c[type]||c.info;d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function timeAgo(t){const d=Date.now()-new Date(t).getTime();const m=Math.floor(d/60000);if(m<1)return'刚刚';if(m<60)return m+'分钟前';const h=Math.floor(m/60);if(h<24)return h+'小时前';return Math.floor(h/24)+'天前'}
function openModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}

// ===== AUTH =====
function doLogout(){S.token='';S.user=null;localStorage.removeItem('qt_token');localStorage.removeItem('qt_user');renderAll()}
function showAuth(tab='login'){
openModal(`
<div class="flex gap-4 mb-5 border-b border-gray-700/50 pb-3">
<button onclick="showAuth('login')" class="text-sm font-medium pb-1 ${tab==='login'?'text-sky-400 border-b-2 border-sky-400':'text-gray-500'}">登录</button>
<button onclick="showAuth('register')" class="text-sm font-medium pb-1 ${tab==='register'?'text-sky-400 border-b-2 border-sky-400':'text-gray-500'}">注册</button>
</div>
<form onsubmit="handleAuth(event,'${tab}')" class="space-y-3">
${tab==='register'?'<input name="email" type="email" required class="input" placeholder="邮箱">':''}
<input name="username" required class="input" placeholder="用户名">
<input name="password" type="password" required class="input" placeholder="密码">
<button type="submit" class="btn btn-primary w-full">${tab==='login'?'登录':'注册'}</button>
</form>`);
}
async function handleAuth(e,mode){
e.preventDefault();const fd=new FormData(e.target);const data=Object.fromEntries(fd);
const r=await api('/auth/'+mode,{method:'POST',body:JSON.stringify(data)});
if(r?.access_token){S.token=r.access_token;S.user=r.user;localStorage.setItem('qt_token',S.token);localStorage.setItem('qt_user',JSON.stringify(S.user));closeModal();toast(mode==='login'?'欢迎回来！':'注册成功！','success');renderAll()}else{toast(r?.detail||'失败','error')}
}

// ===== NAV =====
const NAV_ITEMS=[{id:'feed',icon:'🏠',label:'首页'},{id:'discover',icon:'🔍',label:'发现'},{id:'quantai',icon:'🎯',label:'交易广场'},{id:'market',icon:'📈',label:'行情'},{id:'crypto',icon:'🪙',label:'加密货币'},{id:'forex',icon:'💱',label:'外汇贵金属'},{id:'kline',icon:'📊',label:'K线'},{id:'communities',icon:'🌐',label:'社区'}];
function renderNav(){
document.getElementById('nav-links').innerHTML=NAV_ITEMS.map(n=>`<a href="#" onclick="nav('${n.id}')" class="px-3 py-1.5 rounded-lg text-sm no-underline transition ${S.page===n.id?'bg-white/10 text-white font-medium':'text-gray-400 hover:text-white'}">${n.icon} ${n.label}</a>`).join('');
const nr=document.getElementById('nav-right');
if(S.user){nr.innerHTML=`<div class="flex items-center gap-1">
<div class="relative"><button onclick="toggleNotif()" class="relative p-2 rounded-lg hover:bg-white/5 transition text-gray-400">🔔<span id="notif-badge" class="badge" style="display:none">0</span></button></div>
<div class="relative"><button onclick="nav('messages')" class="relative p-2 rounded-lg hover:bg-white/5 transition text-gray-400">💬<span id="msg-badge" class="badge" style="display:none">0</span></button></div>
<div class="relative"><button onclick="openFriendRequests()" class="relative p-2 rounded-lg hover:bg-white/5 transition text-gray-400">👥<span id="friend-badge" class="badge" style="display:none">0</span></button></div>
</div><span class="text-sm text-gray-400 hidden md:inline">${S.user.username}</span><button onclick="doLogout()" class="btn btn-ghost text-xs">退出</button>`}else{nr.innerHTML=`<button onclick="showAuth('login')" class="btn btn-ghost text-sm">登录</button><button onclick="showAuth('register')" class="btn btn-primary text-sm">注册</button>`}
loadNotifCount();
}

// ===== NOTIFICATIONS =====
async function loadNotifCount(){
if(!S.user)return;
const[r,m,f]=await Promise.all([api('/notifications/'),api('/messages/unread/count'),api('/users/friend-requests')]);
if(r){
const b=document.getElementById('notif-badge');
if(r.unread_count>0){b.style.display='flex';b.textContent=r.unread_count}else{b.style.display='none'}}
if(m){
const mb=document.getElementById('msg-badge');
if(m.unread>0){mb.style.display='flex';mb.textContent=m.unread}else{mb.style.display='none'}}
if(f){
const fb=document.getElementById('friend-badge');
const count=f?.length||0;
if(count>0){fb.style.display='flex';fb.textContent=count}else{fb.style.display='none'}}
}
function toggleNotif(){
openModal('<h3 class="font-semibold mb-3">通知</h3><div id="notif-list" class="space-y-2"><p class="text-gray-500 text-sm">加载中...</p></div>');
loadNotifs();
}
async function loadNotifs(){
const r=await api('/notifications/');if(!r)return;
const el=document.getElementById('notif-list');
if(!r.notifications.length){el.innerHTML='<p class="text-gray-500 text-sm">暂无通知</p>';return}
el.innerHTML=r.notifications.map(n=>`<div class="p-3 rounded-lg ${n.is_read?'glass2':'glass'} cursor-pointer hover:bg-white/5 transition" onclick="readNotif(${n.id})"><div class="text-sm">${esc(n.content)}</div><div class="text-xs text-gray-500 mt-1">${timeAgo(n.created_at)}</div></div>`).join('');
api('/notifications/read-all',{method:'POST'});loadNotifCount();
}
function openFriendRequests(){
S._viewUserId=S.user.id;
S.page='profile';
S._profileTab='friend-requests';
renderNav();
renderPage();
}
async function readNotif(id){await api('/notifications/'+id+'/read',{method:'POST'});loadNotifs();loadNotifCount()}

// ===== SIDEBARS =====
async function renderSidebars(){
// Left
const sl=document.getElementById('sidebar-l');
if(S.user){sl.innerHTML=`<div class="glass rounded-xl p-4"><div class="flex items-center gap-3 mb-3"><div class="avatar avatar-lg" onclick="S.page='profile';S._viewUserId=S.user.id;renderNav();renderPage()">${S.user.username[0].toUpperCase()}</div><div><div class="font-semibold" onclick="S.page='profile';S._viewUserId=S.user.id;renderNav();renderPage()" style="cursor:pointer">${S.user.username}</div><div class="text-xs text-gray-500">${S.user.bio||''}</div></div></div><button onclick="S.page='profile';S._viewUserId=S.user.id;renderNav();renderPage()" class="btn btn-ghost w-full text-xs">查看主页</button></div>`}else{sl.innerHTML=`<div class="glass rounded-xl p-5 text-center"><div class="text-gray-500 text-sm mb-3">加入 QuantTalk</div><button onclick="showAuth('register')" class="btn btn-primary w-full text-sm">注册</button></div>`}
sl.innerHTML+=`<div class="glass rounded-xl p-4"><h3 class="text-xs font-semibold text-gray-500 mb-3">🔥 热门标签</h3><div id="sidebar-tags" class="flex flex-wrap gap-1.5"><span class="text-gray-600 text-xs">加载中</span></div></div>`;

// Right
const sr=document.getElementById('sidebar-r');
sr.innerHTML=`<div class="glass rounded-xl p-4"><h3 class="text-xs font-semibold text-gray-500 mb-3">📈 市场概况</h3><div id="sidebar-market" class="space-y-2 text-sm"><span class="text-gray-600">加载中</span></div></div><div class="glass rounded-xl p-4"><h3 class="text-xs font-semibold text-gray-500 mb-3">🪙 加密货币</h3><div id="sidebar-crypto" class="space-y-2 text-sm"><span class="text-gray-600">加载中</span></div></div><div class="glass rounded-xl p-4"><h3 class="text-xs font-semibold text-gray-500 mb-3">💱 外汇贵金属</h3><div id="sidebar-forex" class="space-y-2 text-sm"><span class="text-gray-600">加载中</span></div></div>`;

// Load data
try{
const [m,s,t,c,f]=await Promise.all([
api('/market/indices'),api('/market/hot-stocks'),api('/market/trending-tags'),
api('/market/crypto'),api('/market/forex')
]);
if(m?.indices)document.getElementById('sidebar-market').innerHTML=m.indices.slice(0,4).map(i=>`<div class="flex justify-between"><span class="text-gray-400">${i.name}</span><span class="${i.change>=0?'gain':'loss'}">${i.change_pct>=0?'+':''}${i.change_pct.toFixed(2)}%</span></div>`).join('');
if(s?.stocks)document.getElementById('sidebar-stocks').innerHTML=s.stocks.slice(0,5).map(i=>`<div class="flex justify-between"><span class="text-gray-400">${i.name}</span><span class="${i.change_pct>=0?'gain':'loss'}">${i.change_pct>=0?'+':''}${i.change_pct.toFixed(2)}%</span></div>`).join('');
if(c?.crypto)document.getElementById('sidebar-crypto').innerHTML=c.crypto.slice(0,5).map(i=>`<div class="flex justify-between"><span class="text-gray-400">${i.name}</span><span class="${i.change_pct>=0?'gain':'loss'}">${i.change_pct>=0?'+':''}${i.change_pct.toFixed(2)}%</span></div>`).join('');
if(f?.forex)document.getElementById('sidebar-forex').innerHTML=f.forex.slice(0,4).map(i=>`<div class="flex justify-between"><span class="text-gray-400">${i.name}</span><span class="${i.change_pct>=0?'gain':'loss'}">${i.change_pct>=0?'+':''}${i.change_pct.toFixed(3)}%</span></div>`).join('');
if(t?.tags)document.getElementById('sidebar-tags').innerHTML=t.tags.slice(0,10).map(i=>`<span class="tag" onclick="searchByTag('${i.name}')">${i.name}</span>`).join('');
}catch(e){}
}

// ===== PAGE ROUTER =====
function nav(page){S.page=page;renderNav();renderPage()}
function renderPage(){
const app=document.getElementById('app');
switch(S.page){
case'feed':renderFeed(app);break;
case'discover':renderDiscover(app);break;
case'quantai':renderQuantAI(app);break;
case'market':renderMarket(app);break;
case'crypto':renderCrypto(app);break;
case'forex':renderForex(app);break;
case'kline':renderKline(app);break;
case'messages':renderMessages(app);break;
case'communities':renderCommunities(app);break;
case'profile':renderProfile(app);break;
case'community':renderCommunityView(app);break;
default:renderFeed(app);
}
}
function renderAll(){renderNav();renderSidebars();renderPage()}

// ===== POST CARD =====
function postCard(p){
const a=p.author||{};const tags=p.tags?p.tags.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag" onclick="searchByTag('${t}')">${t}</span>`).join(' '):'';
return`<article class="glass rounded-xl p-4 fade-in">
<div class="flex gap-3">
<div class="avatar cursor-pointer" onclick="viewProfile(${a.id})">${(a.username||'?')[0].toUpperCase()}</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2"><span class="font-semibold text-sm cursor-pointer hover:text-sky-400" onclick="viewProfile(${a.id})">${a.username||'匿名'}</span><span class="text-xs text-gray-600">${timeAgo(p.created_at)}</span></div>
${p.title?`<div class="font-semibold mt-1.5">${esc(p.title)}</div>`:''}
<p class="mt-1 text-sm text-gray-300 leading-relaxed whitespace-pre-wrap">${esc(p.content)}</p>
${tags?`<div class="flex flex-wrap gap-1.5 mt-2.5">${tags}</div>`:''}
<div class="flex items-center gap-4 mt-3 text-sm text-gray-500">
<button onclick="likePost(${p.id})" class="hover:text-red-400 transition flex items-center gap-1">${p.is_liked?'❤️':'🤍'} ${p.likes_count||0}</button>
<button onclick="toggleComments(${p.id})" class="hover:text-sky-400 transition flex items-center gap-1">💬 ${p.comments_count||0}</button>
<span class="flex items-center gap-1">👁 ${p.views||0}</span>
</div>
<div id="comments-${p.id}" class="hidden mt-3 pt-3 border-t border-gray-700/30"></div>
</div></div></article>`;
}

// ===== FEED =====
async function renderFeed(el){
let form='';
if(S.user)form=`<div class="glass rounded-xl p-4 mb-4 fade-in"><textarea id="post-box" class="input" rows="3" placeholder="分享你的交易策略、市场观点..."></textarea><div class="flex items-center justify-between mt-2"><input id="post-tags" class="input" style="width:200px" placeholder="标签，逗号分隔"><button onclick="submitPost()" class="btn btn-primary">发布</button></div></div>`;
const r=await api(S.user?'/posts/feed':'/posts/');const posts=r?.posts||[];
el.innerHTML=form+(posts.length?`<div class="space-y-3">${posts.map(postCard).join('')}</div>`:'<div class="glass rounded-xl p-12 text-center text-gray-500">暂无动态</div>');
}

async function submitPost(){
const c=document.getElementById('post-box')?.value?.trim();if(!c)return toast('请输入内容','error');
const t=document.getElementById('post-tags')?.value?.trim()||'';
const r=await api('/posts/',{method:'POST',body:JSON.stringify({content:c,tags:t})});
if(r?.id){toast('发布成功','success');renderPage()}else toast(r?.detail||'失败','error');
}
async function likePost(id){const r=await api('/posts/'+id+'/like',{method:'POST'});if(r)renderPage()}
async function toggleComments(id){
const el=document.getElementById('comments-'+id);if(el.classList.contains('hidden')){el.classList.remove('hidden');
el.innerHTML='<p class="text-gray-600 text-sm">加载中...</p>';
const r=await api('/posts/'+id+'/comments');const comments=r||[];
el.innerHTML=(comments.length?comments.map(c=>`<div class="flex gap-2 mb-2 text-sm"><div class="avatar avatar-sm">${(c.author?.username||'?')[0].toUpperCase()}</div><div><span class="font-medium text-xs">${c.author?.username||'匿名'}</span> <span class="text-gray-600 text-xs">${timeAgo(c.created_at)}</span><p class="text-gray-300 mt-0.5">${esc(c.content)}</p></div></div>`).join(''):'<p class="text-gray-600 text-sm">暂无评论</p>')+(S.user?`<form onsubmit="submitComment(event,${id})" class="flex gap-2 mt-2"><input name="content" required class="input flex-1" placeholder="写评论..."><button type="submit" class="btn btn-primary text-xs">发送</button></form>`:'<p class="text-gray-600 text-xs mt-2">登录后可评论</p>');
}else{el.classList.add('hidden')}
}
async function submitComment(e,id){
e.preventDefault();const fd=new FormData(e.target);
const r=await api('/posts/'+id+'/comments',{method:'POST',body:JSON.stringify({content:fd.get('content')})});
if(r?.id){toast('评论成功','success');toggleComments(id);setTimeout(()=>toggleComments(id),100)}else toast('失败','error');
}

// ===== SEARCH =====
function showSearch(){
openModal(`<h3 class="font-semibold mb-3">🔍 搜索</h3><input id="search-input" class="input mb-3" placeholder="搜索帖子、用户..." oninput="doSearch(this.value)"><div id="search-results" class="space-y-2 max-h-80 overflow-y-auto"></div>`);
}
async function doSearch(q){
if(!q.trim()){document.getElementById('search-results').innerHTML='';return}
const[pr,ur]=await Promise.all([api('/posts/?q='+encodeURIComponent(q)),api('/users/search?q='+encodeURIComponent(q))]);
const posts=pr?.posts||[];const users=ur||[];
let html='';
if(users.length)html+=users.map(u=>`<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 cursor-pointer" onclick="closeModal();viewProfile(${u.id})"><div class="avatar avatar-sm">${u.username[0].toUpperCase()}</div><span class="text-sm">${u.username}</span></div>`).join('');
if(posts.length)html+=posts.map(p=>`<div class="p-2 rounded-lg hover:bg-white/5 cursor-pointer" onclick="closeModal();toggleComments(${p.id})"><div class="text-xs text-gray-500">${p.author?.username} · ${timeAgo(p.created_at)}</div><div class="text-sm">${esc(p.content).substring(0,80)}...</div></div>`).join('');
if(!html)html='<p class="text-gray-600 text-sm">无结果</p>';
document.getElementById('search-results').innerHTML=html;
}
function searchByTag(tag){S.page='feed';renderNav();const app=document.getElementById('app');app.innerHTML='<p class="text-gray-500 text-center py-8">搜索中...</p>';api('/posts/?tag='+encodeURIComponent(tag)).then(r=>{const posts=r?.posts||[];app.innerHTML=`<div class="mb-3"><button onclick="nav('feed')" class="btn btn-ghost text-xs">← 返回首页</button> <span class="tag ml-2">${tag}</span></div>`+(posts.length?`<div class="space-y-3">${posts.map(postCard).join('')}</div>`:'<p class="text-gray-500 text-center py-8">无相关帖子</p>')})}

// ===== USER PROFILE =====
function viewProfile(id){
S._viewUserId=id;S.page='profile';renderNav();renderPage();
}
async function renderProfile(el){
const uid=S._viewUserId;if(!uid)return;
const r=await api('/users/'+uid);if(!r){el.innerHTML='<p class="text-gray-500">用户不存在</p>';return}
const isSelf=S.user&&S.user.id===uid;
// 获取好友状态
let friendStatus={is_friend:false,has_pending_request_from_me:false,has_pending_request_to_me:false};
if(!isSelf && S.user){
friendStatus=await api('/users/friend-status/'+uid)||friendStatus;
}
const isFriend=friendStatus.is_friend;
const hasReqFromMe=friendStatus.has_pending_request_from_me;
const hasReqToMe=friendStatus.has_pending_request_to_me;
S._profileTab=isSelf?'posts':'posts'; // 默认显示帖子
let actionButtons='';
if(isSelf){
actionButtons=`<button onclick="showProfileEdit()" class="btn btn-ghost text-sm">编辑资料</button>`;
}else if(isFriend){

async function searchAddFriend(q){

if(!q.trim()){resultsEl.innerHTML='';return;}
const users=await api('/users/search?q='+encodeURIComponent(q));
if(!users?.length){resultsEl.innerHTML='<p class="text-gray-500 text-sm">未找到用户</p>';return;}
let html='';
for(const u of users){
const status=await api('/users/friend-status/'+u.id)||{};
let btn='';
if(status.is_friend){
btn='<span class="text-xs text-green-400">已是好友</span>';
}else if(status.has_pending_request_from_me){
btn='<span class="text-xs text-yellow-400">已发送申请</span>';
}else if(status.has_pending_request_to_me){
btn='<button onclick="acceptFriendById('+u.id+')" class="btn btn-primary btn-xs">接受申请</button>';
}else{
btn='<button onclick="quickSendFriendReq('+u.id+')" class="btn btn-primary btn-xs">添加</button>';

</div>`;
}

}

let _signalDirection = '';

async function loadSignals(direction){
    _signalDirection = direction;
    const el = document.getElementById('signals-feed');
    if(!el) return;
    const params = direction ? `?direction=${direction}` : '';
    const r = await api('/quantai/square' + params);
    const signals = r?.signals || [];
    if(!signals.length){
        el.innerHTML = `<div class="glass rounded-xl p-8 text-center"><div class="text-gray-500 text-sm mb-2">暂无信号</div><button onclick="showCreateSignal()" class="btn btn-primary text-sm">成为第一个发布者</button></div>`;
        return;
    }
    el.innerHTML = signals.map(s => signalCard(s)).join('');
}

function signalCard(s){
    const dirColor = s.direction === 'LONG' ? 'gain' : 'loss';
    const dirLabel = s.direction === 'LONG' ? '多' : '空';
    const dirBg = s.direction === 'LONG' ? 'rgba(34,197,94,.1)' : 'rgba(239,68,68,.1)';
    const statusColor = s.status === 'ACTIVE' ? 'text-green-400' : 'text-gray-500';
    return `<div class="glass rounded-xl p-4">
        <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-2">
                <div class="avatar avatar-sm">${(s.author?.username||'?')[0].toUpperCase()}</div>
                <div>
                    <div class="text-sm font-medium">${esc(s.author?.username||'未知')}</div>
                    <div class="text-xs text-gray-500">${timeAgo(s.created_at)}</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded" style="background:${dirBg};color:${s.direction==='LONG'?'#22c55e':'#ef4444'}">${dirLabel} ${s.symbol}</span>
                <span class="text-xs ${statusColor}">${s.status==='ACTIVE'?'进行中':'已平仓'}</span>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-3 mb-3 text-sm">
            <div><div class="text-xs text-gray-500">入场价</div><div class="font-medium">${s.entry_price >= 1 ? s.entry_price.toLocaleString() : s.entry_price.toFixed(6)}</div></div>
            <div><div class="text-xs text-gray-500">止损</div><div class="font-medium loss">${s.stop_loss ? (s.stop_loss >= 1 ? s.stop_loss.toLocaleString() : s.stop_loss.toFixed(6)) : '-'}</div></div>
            <div><div class="text-xs text-gray-500">止盈</div><div class="font-medium gain">${s.take_profit ? (s.take_profit >= 1 ? s.take_profit.toLocaleString() : s.take_profit.toFixed(6)) : '-'}</div></div>
        </div>
        ${s.notes ? `<div class="text-xs text-gray-400 mb-3">${esc(s.notes)}</div>` : ''}
        ${s.tags ? `<div class="flex gap-1 mb-3 flex-wrap">${s.tags.split(',').map(t=>`<span class="tag" style="font-size:10px;padding:1px 6px">${t.trim()}</span>`).join('')}</div>` : ''}
        <div class="flex items-center justify-between pt-2 border-t border-gray-700/20">
            <div class="flex gap-3 text-xs text-gray-500">
                <span>👍 ${s.likes_count || 0}</span>
                <span>💬 ${s.comments_count || 0}</span>
                <span>⏱ ${s.timeframe}</span>
            </div>
            <div class="flex gap-2">
                ${s.status==='ACTIVE'&&s.user_id===S.user?.id?`<button onclick="showCloseSignal(${s.id},'${s.symbol}')" class="btn btn-ghost text-xs">平仓</button>`:''}
                <button onclick="gotoKline('${s.symbol.toLowerCase()}')" class="btn btn-ghost text-xs">K线</button>
            </div>
        </div>
    </div>`;
}

async function handleCreateSignal(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd);
    data.entry_price = parseFloat(data.entry_price);
    if(data.stop_loss) data.stop_loss = parseFloat(data.stop_loss);
    if(data.take_profit) data.take_profit = parseFloat(data.take_profit);
    const r = await api('/quantai/signals', {method:'POST',body:JSON.stringify(data)});
    if(r?.id){closeModal();toast('信号发布成功！','success');await loadSignals(_signalDirection)}
    else{toast(r?.detail||'发布失败','error')}
}

function showCloseSignal(id, symbol){
    openModal(`<h3 class="font-semibold mb-4">📊 平仓信号 ${symbol}</h3>
    <form onsubmit="handleCloseSignal(event,${id})" class="space-y-3">
        <div><label class="text-xs text-gray-500">平仓盈亏 (%)</label><input name="pnl_pct" type="number" step="0.01" required class="input" placeholder="如 2.5 或 -1.2"></div>
        <button type="submit" class="btn btn-primary w-full">确认平仓</button>
    </form>`);
}

async function handleCloseSignal(e, id){
    e.preventDefault();
    const pnl = parseFloat(new FormData(e.target).get('pnl_pct'));
    const r = await api(`/quantai/signals/${id}/close?pnl_pct=${pnl}`, {method:'PUT'});
    if(r?.message){closeModal();toast('平仓成功','success');await loadSignals(_signalDirection)}
    else{toast(r?.detail||'失败','error')}
}

let wsHeartbeatInterval=null;
let wsPingTimeout=null;

function connectWS(){
if(S.ws){S.ws.close();S.ws=null}
if(wsHeartbeatInterval){clearInterval(wsHeartbeatInterval);wsHeartbeatInterval=null;}
if(wsPingTimeout){clearTimeout(wsPingTimeout);wsPingTimeout=null;}
if(!S.token||!S._currentChannel)return;
const proto=location.protocol==='https:'?'wss:':'ws:';
S.ws=new WebSocket(`${proto}//${location.host}/api/ws/channel/${S._currentChannel}?token=${S.token}`);

// 更新在线状态指示
document.getElementById('channel-online-count').textContent=communityMembers.filter(m=>onlineUsersCache[m.user_id]||m.is_online).length+1;

S.ws.onopen=()=>{
// 启动心跳（每25秒发送一次）
wsHeartbeatInterval=setInterval(()=>{
if(S.ws?.readyState===1){
S.ws.send(JSON.stringify({type:'heartbeat'}));
// 设置响应超时
wsPingTimeout=setTimeout(()=>{
if(S.ws?.readyState===1){
document.getElementById('my-status-dot').className='absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-yellow-500 border-2 border-[#141c2e]';
}
},5000);
}
},25000);
};

S.ws.onmessage=(e)=>{
const m=JSON.parse(e.data);
if(m.type==='message'){
const el=document.getElementById('chat-messages');
if(el.querySelector('.text-gray-600.text-sm.text-center'))el.innerHTML='';
const t=new Date(m.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const isOnline=onlineUsersCache[m.author_id]||false;
el.innerHTML+=`<div class="flex gap-2.5 fade-in"><div class="relative flex-shrink-0"><div class="avatar avatar-sm">${(m.author_username||'?')[0].toUpperCase()}</div><span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full ${isOnline?'bg-green-500':'bg-gray-500'} border border-[#141c2e]"></span></div><div><div class="flex items-center gap-2"><span class="font-medium text-xs">${m.author_username||'匿名'}</span><span class="text-xs text-gray-600">${t}</span></div><p class="text-sm text-gray-300 mt-0.5">${esc(m.content)}</p></div></div>`;
el.scrollTop=el.scrollHeight;
}else if(m.type==='user_joined'){
// 新用户加入
toast(`${m.username} 加入了频道`, 'info');
// 刷新成员
refreshMembers();
}else if(m.type==='user_left'){
// 用户离开
refreshMembers();
}else if(m.type==='status_changed'){
// 状态变更
refreshMembers();
}else if(m.type==='heartbeat_ack'){
// 心跳响应
document.getElementById('my-status-dot').className='absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-green-500 border-2 border-[#141c2e]';
if(wsPingTimeout){clearTimeout(wsPingTimeout);wsPingTimeout=null;}
}else if(m.type==='ping'){
// 服务器ping
S.ws?.send(JSON.stringify({type:'heartbeat'}));
}
};

S.ws.onclose=()=>{
if(wsHeartbeatInterval){clearInterval(wsHeartbeatInterval);wsHeartbeatInterval=null;}
if(wsPingTimeout){clearTimeout(wsPingTimeout);wsPingTimeout=null;}
document.getElementById('my-status-dot').className='absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-gray-500 border-2 border-[#141c2e]';
setTimeout(()=>{if(S.page==='community'&&S._currentChannel)connectWS()},5000);
};

S.ws.onerror=()=>{
if(wsHeartbeatInterval){clearInterval(wsHeartbeatInterval);wsHeartbeatInterval=null;}
document.getElementById('my-status-dot').className='absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-red-500 border-2 border-[#141c2e]';
};
}

}

function initKlineChart(){
    // 清理旧图表
    if(klineChart){
        klineChart.remove();
        klineChart = null;
    }
    
    const container = document.getElementById('kline-chart');
    if(!container) return;
    
    container.innerHTML = '';
    
    klineChart = LightweightCharts.createChart(container, {
        layout: {
            background: { type: 'solid', color: 'transparent' },
            textColor: '#94a3b8',
        },
        grid: {
            vertLines: { color: 'rgba(100, 116, 139, 0.1)' },
            horzLines: { color: 'rgba(100, 116, 139, 0.1)' },
        },
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: { color: '#38bdf8', width: 1, style: 2 },
            horzLine: { color: '#38bdf8', width: 1, style: 2 },
        },
        rightPriceScale: {
            borderColor: 'rgba(100, 116, 139, 0.2)',
        },
        timeScale: {
            borderColor: 'rgba(100, 116, 139, 0.2)',
            timeVisible: true,
            secondsVisible: false,
        },
        handleScroll: { vertTouchDrag: false },
    });
    
    // 蜡烛图系列
    klineCandleSeries = klineChart.addCandlestickSeries({
        upColor: '#22c55e',
        downColor: '#ef4444',
        borderUpColor: '#22c55e',
        borderDownColor: '#ef4444',
        wickUpColor: '#22c55e',
        wickDownColor: '#ef4444',
    });
    
    // 成交量系列
    klineVolumeSeries = klineChart.addHistogramSeries({
        color: '#38bdf8',
        priceFormat: { type: 'volume' },
        priceScaleId: '',
    });
    
    klineVolumeSeries.priceScale().applyOptions({
        scaleMargins: { top: 0.85, bottom: 0 },
    });
    
    // 响应窗口大小变化
    const resizeObserver = new ResizeObserver(entries => {
        if(klineChart && entries[0]){
            const { width, height } = entries[0].contentRect;
            klineChart.resize(width, height);
        }
    });
    resizeObserver.observe(container);
}

async function loadKlineData(){
    try {
        const r = await api(`/market/kline/${klineSymbol}?period=${klinePeriod}&limit=200`);
        if(!r || !r.data) return;

        // 数据来源
        const srcEl = document.getElementById('kline-source');
        if(srcEl) srcEl.textContent = r.source === 'binance' ? 'Binance 实时' : '模拟数据';

        // 更新概览
        if(r.latest){
            const priceEl = document.getElementById('kline-price');
            const changeEl = document.getElementById('kline-change');
            const pctEl = document.getElementById('kline-change-pct');
            const price = r.latest.price || 0;
            const change = r.latest.change || 0;
            const pct = r.latest.change_pct || 0;
            priceEl.textContent = price >= 1000 ? price.toLocaleString() : price.toFixed(price < 1 ? 6 : 2);
            changeEl.textContent = (change >= 0 ? '+' : '') + (Math.abs(change) >= 1 ? change.toFixed(2) : change.toFixed(6));
            changeEl.className = 'text-lg font-medium ' + (change >= 0 ? 'gain' : 'loss');
            pctEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
            pctEl.className = 'text-lg font-medium ' + (pct >= 0 ? 'gain' : 'loss');
            document.getElementById('kline-volume').textContent = formatVolume(r.latest.volume);
        }
        
        // 转换数据格式
        const candleData = r.data.map(d => ({
            time: Math.floor(d.time / 1000),
            open: d.open,
            high: d.high,
            low: d.low,
            close: d.close,
        }));
        
        const volumeData = r.data.map(d => ({
            time: Math.floor(d.time / 1000),
            value: d.volume,
            color: d.close >= d.open ? 'rgba(34, 197, 94, 0.5)' : 'rgba(239, 68, 68, 0.5)',
        }));
        
        // 设置数据
        if(klineCandleSeries) klineCandleSeries.setData(candleData);
        if(klineVolumeSeries) klineVolumeSeries.setData(volumeData);
        
        // 自适应时间范围
        if(klineChart) klineChart.timeScale().fitContent();
        
    } catch(e){
        console.error('K线数据加载失败:', e);
    }
}

function formatVolume(v){
    if(!v) return '--';
    if(v >= 100000000) return (v / 100000000).toFixed(2) + '亿';
    if(v >= 10000) return (v / 10000).toFixed(0) + '万';
    return v.toString();
}

async function loadQuickMarket(tab='stock'){
    try {
        let symbols = [];
        if(tab === 'stock'){
            const r = await api('/market/indices');
            if(!r?.indices) return;
            symbols = r.indices.slice(0,8).map(i=>({symbol:i.symbol,name:i.name,price:i.price,change_pct:i.change_pct}));
        } else if(tab === 'crypto'){
            const r = await api('/market/crypto');
            if(!r?.crypto) return;
            symbols = r.crypto.slice(0,8).map(c=>({symbol:c.symbol,name:c.name,price:c.price,change_pct:c.change_pct}));
        } else if(tab === 'forex'){
            const r = await api('/market/forex');
            if(!r?.forex) return;
            symbols = r.forex.slice(0,8).map(f=>({symbol:f.symbol,name:f.name,price:f.price,change_pct:f.change_pct}));
        }

        symbols.forEach(item => {
            const el = document.getElementById(`quick-price-${item.symbol}`);
            if(el){
                el.textContent = item.price?.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:item.price<1?6:2}) || '--';
                el.className = 'text-sm font-medium ' + (item.change_pct >= 0 ? 'gain' : 'loss');
            }
        });

        // 更新按钮状态
        ['stock','crypto','forex'].forEach(t => {
            const btn = document.getElementById(`quick-btn-${t}`);
            if(btn) btn.className = `text-xs px-2 py-1 rounded ${t===tab?'bg-sky-500/20 text-sky-400':'bg-white/5 text-gray-400 hover:text-white'}`;
        });
    } catch(e){}
}

function switchSymbol(symbol){
    klineSymbol = symbol;
    document.getElementById('kline-symbol').value = symbol;
    loadKlineData();
}

function changeKlineSymbol(symbol){
    klineSymbol = symbol;
    loadKlineData();
}

function changeKlinePeriod(period){
    klinePeriod = period;
    loadKlineData();
}

function refreshKline(){
    loadKlineData();
    loadQuickMarket();
}

function startKlineUpdate(){
    // 清除旧定时器
    if(klineUpdateInterval) clearInterval(klineUpdateInterval);
    
    // 每30秒更新一次实时数据
    klineUpdateInterval = setInterval(async () => {
        if(S.page !== 'kline'){
            clearInterval(klineUpdateInterval);
            return;
        }
        try {
            const r = await api(`/market/realtime/${klineSymbol}`);
            if(r){
                const change = r.change || 0;
                const pct = r.change_pct || 0;
                document.getElementById('kline-price').textContent = r.price?.toLocaleString() || '--';
                const changeEl = document.getElementById('kline-change');
                const pctEl = document.getElementById('kline-change-pct');
                changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2);
                changeEl.className = 'text-lg font-medium ' + (change >= 0 ? 'gain' : 'loss');
                pctEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
                pctEl.className = 'text-lg font-medium ' + (pct >= 0 ? 'gain' : 'loss');
                document.getElementById('kline-volume').textContent = formatVolume(r.volume);
            }
        } catch(e){}
    }, 30000);
}
