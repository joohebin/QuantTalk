<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTalk - 量化交易平台</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        body{background:#121212;color:#fff;height:100vh;display:flex;overflow:hidden;}
        
        .sidebar{width:260px;background:#1e1e1e;border-right:1px solid #333;padding:20px 0;overflow-y:auto;}
        .logo{text-align:center;font-size:20px;color:#00ff88;font-weight:bold;margin-bottom:30px;}
        
        .menu-item{padding:12px 25px;color:#fff;cursor:pointer;font-size:15px;transition:.2s;}
        .menu-item.active{background:#2b291b;color:#ffcc00;}
        
        .submenu{display:none;padding-left:20px;}
        .submenu.show{display:block;}
        .submenu-item{
            padding:8px 25px;
            margin:2px 0;
            border-radius:4px;
            font-size:14px;
            color:#cccccc;
            cursor:pointer;
            transition:.2s;
        }
        .submenu-item:hover{background:#2a2a2a;color:#ffffff;}
        .submenu-item.active{color:#00ff88;font-weight:500;}
        
        .content{flex:1;padding:30px;overflow-y:auto;background:#121212;}
        .page-title{font-size:22px;color:#00ff88;margin-bottom:20px;}
        
        .card{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:20px;margin-bottom:20px;}
        .tv-container{width:100%;height:480px;border-radius:8px;background:#1e1e1e;margin-bottom:20px;}
        
        input, select, textarea, button{
            width:100%;padding:10px 12px;border-radius:4px;
            border:1px solid #444;background:#252525;color:#fff;
            outline:none;margin-bottom:12px;
        }
        button{background:#00ff88;color:#111;font-weight:bold;cursor:pointer;border:none;}
        button:hover{opacity:.9;}

        .form-label{margin-bottom:6px;display:block;color:#eee;}
        .tip{color:#888;font-size:12px;margin-top:4px;}
        
        .chat-box{height:400px;border:1px solid #333;border-radius:8px;padding:15px;background:#1a1a1a;margin-bottom:15px;overflow-y:auto;}
        .chat-input{height:auto;}
        .post-card{border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px;background:#1b1b1b;}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    </style>
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<div class="sidebar">
    <div class="logo">QuantTalk</div>

    <div class="menu-item active" onclick="toggleSub(1)">交易市场</div>
    <div class="submenu show" id="sub1">
        <div class="submenu-item active" onclick="renderPage('trade-hall', this)">交易大厅</div>
        <div class="submenu-item" onclick="renderPage('crypto-market', this)">加密货币专区</div>
        <div class="submenu-item" onclick="renderPage('forex-metal', this)">外汇贵金属</div>
        <div class="submenu-item" onclick="renderPage('future-market', this)">期货市场</div>
        <div class="submenu-item" onclick="renderPage('kline-pro', this)">专业K线分析</div>
    </div>

    <div class="menu-item" onclick="toggleSub(2)">交易社区</div>
    <div class="submenu" id="sub2">
        <div class="submenu-item" onclick="renderPage('dynamic-square', this)">综合动态广场</div>
        <div class="submenu-item" onclick="renderPage('strategy-square', this)">量化策略广场</div>
        <div class="submenu-item" onclick="renderPage('copy-trade', this)">一键跟单</div>
        <div class="submenu-item" onclick="renderPage('trade-live', this)">交易直播</div>
    </div>

    <div class="menu-item" onclick="toggleSub(3)">社区频道</div>
    <div class="submenu" id="sub3">
        <div class="submenu-item" onclick="renderPage('all-channel', this)">全部公共频道</div>
        <div class="submenu-item" onclick="renderPage('signal-channel', this)">交易信号频道</div>
        <div class="submenu-item" onclick="renderPage('official-channel', this)">官方公告频道</div>
        <div class="submenu-item" onclick="renderPage('my-channel', this)">我的频道管理</div>
    </div>

    <div class="menu-item" onclick="toggleSub(4)">社交消息</div>
    <div class="submenu" id="sub4">
        <div class="submenu-item" onclick="renderPage('private-chat', this)">私信聊天</div>
        <div class="submenu-item" onclick="renderPage('friend-list', this)">好友列表</div>
        <div class="submenu-item" onclick="renderPage('private-group', this)">私密群组</div>
    </div>

    <div class="menu-item" onclick="toggleSub(5)">个人中心</div>
    <div class="submenu" id="sub5">
        <div class="submenu-item" onclick="renderPage('user-info', this)">个人资料</div>
        <div class="submenu-item" onclick="renderPage('exchange-api', this)">交易所API绑定</div>
        <div class="submenu-item" onclick="renderPage('wallet-manage', this)">钱包管理</div>
        <div class="submenu-item" onclick="renderPage('bot-manage', this)">量化Bot管理</div>
    </div>
</div>

<div class="content" id="mainContent"></div>

<script>
function toggleSub(num){
    document.querySelectorAll('.submenu').forEach(el=>el.classList.remove('show'));
    document.getElementById('sub'+num).classList.add('show');
    document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.menu-item')[num-1].classList.add('active');
}

function renderPage(pageName, el){
    document.querySelectorAll('.submenu-item').forEach(i=>i.classList.remove('active'));
    el.classList.add('active');
    let html = '';

    // ====================== 1. 交易市场全页面 ======================
    if(pageName==="trade-hall"){
        html=`<div class="page-title">交易大厅</div><div class="tv-container" id="tv1"></div>
        <div class="card"><p class="form-label">Webhook 交易推送地址</p>
        <input value="https://quantsignalkitokito.duckdns.org/api/webhook/trade" readonly>
        <button onclick="copyWebhook()">复制地址</button></div>`;
    }
    if(pageName==="crypto-market"){
        html=`<div class="page-title">加密货币专区</div><div class="tv-container" id="tv2"></div>`;
    }
    if(pageName==="forex-metal"){
        html=`<div class="page-title">外汇贵金属</div><div class="tv-container" id="tv3"></div>`;
    }
    if(pageName==="future-market"){
        html=`<div class="page-title">期货市场</div><div class="tv-container" id="tv4"></div>`;
    }
    if(pageName==="kline-pro"){
        html=`<div class="page-title">专业K线分析</div><div class="tv-container" id="tv5"></div>`;
    }

    // ====================== 2. 交易社区 UI 骨架 ======================
    if(pageName==="dynamic-square"){
        html=`<div class="page-title">综合动态广场</div>
        <div class="post-card"><h4>用户昵称</h4><p>这是一条交易动态内容</p><small>2025-01-01</small></div>
        <div class="post-card"><h4>交易达人</h4><p>BTC 突破 100,000 USDT</p><small>2025-01-01</small></div>`;
    }
    if(pageName==="strategy-square"){
        html=`<div class="page-title">量化策略广场</div><div class="grid">
        <div class="card"><h4>网格策略</h4><p>月收益：12.5%</p><button>查看详情</button></div>
        <div class="card"><h4>马丁策略</h4><p>月收益：18.2%</p><button>查看详情</button></div></div>`;
    }
    if(pageName==="copy-trade"){
        html=`<div class="page-title">一键跟单</div><div class="card">
        <label>选择交易高手</label><select><option>高手A</option><option>高手B</option></select>
        <button>开启自动跟单</button></div>`;
    }
    if(pageName==="trade-live"){
        html=`<div class="page-title">交易直播</div><div class="card"><p>直播房间列表加载中…</p></div>`;
    }

    // ====================== 3. 社区频道 ======================
    if(pageName==="all-channel"){
        html=`<div class="page-title">全部公共频道</div><div class="card"><p>公共频道聊天窗口</p></div>`;
    }
    if(pageName==="signal-channel"){
        html=`<div class="page-title">交易信号频道</div><div class="card"><p>自动交易信号实时推送</p></div>`;
    }
    if(pageName==="official-channel"){
        html=`<div class="page-title">官方公告频道</div><div class="card"><p>平台公告、版本更新、活动通知</p></div>`;
    }
    if(pageName==="my-channel"){
        html=`<div class="page-title">我的频道管理</div><div class="card"><p>自建频道、权限管理</p></div>`;
    }

    // ====================== 4. 社交消息 ======================
    if(pageName==="private-chat"){
        html=`<div class="page-title">私信聊天</div><div class="chat-box">聊天消息记录</div>
        <input placeholder="输入消息…"><button>发送</button>`;
    }
    if(pageName==="friend-list"){
        html=`<div class="page-title">好友列表</div><div class="card"><p>好友 1（在线）</p><p>好友 2（离线）</p></div>`;
    }
    if(pageName==="private-group"){
        html=`<div class="page-title">私密群组</div><div class="card"><p>群组聊天窗口</p></div>`;
    }

    // ====================== 5. 个人中心全套表单 ======================
    if(pageName==="user-info"){
        html=`<div class="page-title">个人资料</div><div class="card">
        <label>昵称</label><input placeholder="请输入昵称">
        <label>个人简介</label><textarea rows="3" placeholder="简单介绍自己"></textarea>
        <button>保存资料</button></div>`;
    }
    if(pageName==="exchange-api"){
        html=`<div class="page-title">交易所API绑定</div><div class="card">
        <label>选择交易所</label><select><option>币安</option><option>OKX</option></select>
        <label>API Key</label><input placeholder="输入交易所API Key">
        <label>API Secret</label><input placeholder="输入API Secret">
        <button onclick="alert('API 校验成功（前端模拟）')">保存并校验</button></div>`;
    }
    if(pageName==="wallet-manage"){
        html=`<div class="page-title">钱包管理</div><div class="card">
        <label>链类型</label><select><option>ETH</option><option>TRON</option></select>
        <label>钱包地址</label><input placeholder="0x...">
        <button>绑定钱包</button></div>`;
    }
    if(pageName==="bot-manage"){
        html=`<div class="page-title">量化Bot管理</div><div class="card">
        <label>Bot 类型</label><select><option>网格交易</option><option>马丁策略</option></select>
        <label>运行状态</label><input value="已停止" readonly>
        <button>启动Bot</button></div>`;
    }

    document.getElementById("mainContent").innerHTML = html;

    if(pageName==="trade-hall")initTV("tv1","BINANCE:BTCUSDT");
    if(pageName==="crypto-market")initTV("tv2","BINANCE:ETHUSDT");
    if(pageName==="forex-metal")initTV("tv3","FX_IDC:XAUUSD");
    if(pageName==="future-market")initTV("tv4","CME:NQ1!");
    if(pageName==="kline-pro")initTV("tv5","NASDAQ:AAPL");
}

function initTV(id, symbol){
    new TradingView.widget({autosize:true,symbol:symbol,interval:"D",timezone:"Asia/Shanghai",theme:"dark",style:"1",locale:"zh",container_id:id});
}

function copyWebhook(){
    const inp=document.querySelector('input[value*="duckdns"]');
    inp.select();document.execCommand('copy');alert("✅ Webhook 已复制");
}

window.onload=()=>renderPage('trade-hall', document.querySelector('.submenu-item.active'));
</script>
</body>
</html>
