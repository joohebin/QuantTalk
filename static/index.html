<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTalk</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        body{background:#121212;color:#fff;height:100vh;overflow:hidden;}
        .sidebar{width:260px;background:#1e1e1e;border-right:1px solid #333;padding:20px 0;overflow-y:auto;}
        .logo{text-align:center;font-size:20px;color:#00ff88;font-weight:bold;margin-bottom:20px;}
        .menu-item{padding:12px 25px;color:#fff;cursor:pointer;font-size:15px;transition:.2s;}
        .menu-item.active{background:#2b291b;color:#ffcc00;}
        .submenu{display:none;padding-left:20px;}
        .submenu.show{display:block;}
        .submenu-item{padding:8px 25px;margin:2px 0;border-radius:4px;font-size:14px;color:#cccccc;cursor:pointer;transition:.2s;}
        .submenu-item:hover{background:#2a2a2a;color:#ffffff;}
        .submenu-item.active{color:#00ff88;font-weight:500;}
        .content{flex:1;padding:30px;overflow-y:auto;background:#121212;}
        .page-title{font-size:22px;color:#00ff88;margin-bottom:20px;}
        .card{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:20px;margin-bottom:20px;}
        .tv-container{width:100%;height:480px;border-radius:8px;background:#1e1e1e;margin-bottom:20px;}
        input, select, textarea, button{width:100%;padding:10px 12px;border-radius:4px;border:1px solid #444;background:#252525;color:#fff;outline:none;margin-bottom:12px;}
        button{background:#00ff88;color:#111;font-weight:bold;cursor:pointer;border:none;}
        button:hover{opacity:.9;}
        .form-label{margin-bottom:6px;display:block;color:#eee;}
        .tip{color:#888;font-size:12px;margin-top:4px;}
        .chat-box{height:400px;border:1px solid #333;border-radius:8px;padding:15px;background:#1a1a1a;margin-bottom:15px;overflow-y:auto;}
        .post-card{border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px;background:#1b1b1b;}
        .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
        .voice-controls{display:flex;gap:10px;margin-top:10px;}
        .voice-btn{flex:1;padding:8px;background:#252525;border:none;color:#fff;border-radius:4px;cursor:pointer;}
        .voice-btn.active{background:#00ff88;color:#111;}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;}
        .modal-box{background:#1e1e1e;padding:30px;border-radius:8px;width:400px;}
        .tab-btn{width:50%;background:#252525;border:none;color:#fff;padding:10px;cursor:pointer;}
        .tab-btn.active{background:#00ff88;color:#111;}
    </style>
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-box">
        <div style="display:flex;margin-bottom:20px;">
            <button class="tab-btn active" onclick="switchTab('login')" data-lang="txt_login">登录</button>
            <button class="tab-btn" onclick="switchTab('register')" data-lang="txt_reg">注册</button>
        </div>
        <div id="loginForm">
            <label class="form-label" data-lang="txt_acc">用户名/邮箱</label>
            <input id="login-account" placeholder="" data-lang-placeholder="txt_acc_plh">
            <label class="form-label" data-lang="txt_pwd">密码</label>
            <input id="login-password" type="password">
            <button onclick="doAccountLogin()" data-lang="txt_login_btn">登录</button>
            <p class="tip" style="text-align:center;margin-top:10px;">或</p>
            <button style="background:#3b82f6;" data-lang="txt_web3">Web3 钱包登录</button>
        </div>
        <div id="registerForm" style="display:none;">
            <label class="form-label" data-lang="txt_uname">用户名</label>
            <input id="reg-username">
            <label class="form-label" data-lang="txt_email">邮箱</label>
            <input id="reg-email" type="email">
            <label class="form-label" data-lang="txt_pwd">密码</label>
            <input id="reg-password" type="password">
            <button onclick="doAccountRegister()" data-lang="txt_reg_btn">注册</button>
        </div>
    </div>
</div>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="logo">QuantTalk</div>

    <div class="menu-item active" onclick="toggleSub(1)" data-lang="m1">交易市场</div>
    <div class="submenu show" id="sub1">
        <div class="submenu-item active" onclick="renderPage('trade-hall', this)" data-lang="m1_1">交易大厅</div>
        <div class="submenu-item" onclick="renderPage('crypto-market', this)" data-lang="m1_2">加密货币专区</div>
        <div class="submenu-item" onclick="renderPage('forex-metal', this)" data-lang="m1_3">外汇贵金属</div>
        <div class="submenu-item" onclick="renderPage('future-market', this)" data-lang="m1_4">期货市场</div>
        <div class="submenu-item" onclick="renderPage('kline-pro', this)" data-lang="m1_5">专业K线分析</div>
    </div>

    <div class="menu-item" onclick="toggleSub(2)" data-lang="m2">交易社区</div>
    <div class="submenu" id="sub2">
        <div class="submenu-item" onclick="renderPage('dynamic-square', this)" data-lang="m2_1">综合动态广场</div>
        <div class="submenu-item" onclick="renderPage('strategy-square', this)" data-lang="m2_2">量化策略广场</div>
        <div class="submenu-item" onclick="renderPage('backtest-center', this)" data-lang="m2_3">回测中心</div>
        <div class="submenu-item" onclick="renderPage('ranking-list', this)" data-lang="m2_4">交易榜单</div>
        <div class="submenu-item" onclick="renderPage('copy-trade', this)" data-lang="m2_5">一键跟单</div>
        <div class="submenu-item" onclick="renderPage('trade-live', this)" data-lang="m2_6">交易直播</div>
    </div>

    <div class="menu-item" onclick="toggleSub(3)" data-lang="m3">社区频道</div>
    <div class="submenu" id="sub3">
        <div class="submenu-item" onclick="renderPage('create-channel', this)" data-lang="m3_1">+ 创建新频道</div>
        <div class="submenu-item" onclick="renderPage('text-channel', this)" data-lang="m3_2">文字频道</div>
        <div class="submenu-item" onclick="renderPage('voice-channel', this)" data-lang="m3_3">语音频道</div>
        <div class="submenu-item" onclick="renderPage('video-channel', this)" data-lang="m3_4">视频/共享频道</div>
        <div class="submenu-item" onclick="renderPage('signal-channel', this)" data-lang="m3_5">交易信号频道</div>
        <div class="submenu-item" onclick="renderPage('official-channel', this)" data-lang="m3_6">官方公告频道</div>
    </div>

    <div class="menu-item" onclick="toggleSub(4)" data-lang="m4">社交消息</div>
    <div class="submenu" id="sub4">
        <div class="submenu-item" onclick="renderPage('private-chat', this)" data-lang="m4_1">私信聊天</div>
        <div class="submenu-item" onclick="renderPage('friend-list', this)" data-lang="m4_2">好友列表</div>
        <div class="submenu-item" onclick="renderPage('private-group', this)" data-lang="m4_3">私密群组</div>
    </div>

    <div class="menu-item" onclick="toggleSub(5)" data-lang="m5">个人中心</div>
    <div class="submenu" id="sub5">
        <div class="submenu-item" onclick="renderPage('user-info', this)" data-lang="m5_1">个人资料</div>
        <div class="submenu-item" onclick="renderPage('lang-setting', this)" data-lang="m5_2">语言设置</div>
        <div class="submenu-item" onclick="renderPage('exchange-api', this)" data-lang="m5_3">交易所API绑定</div>
        <div class="submenu-item" onclick="renderPage('wallet-manage', this)" data-lang="m5_4">钱包管理</div>
        <div class="submenu-item" onclick="renderPage('bot-manage', this)" data-lang="m5_5">量化Bot管理</div>
    </div>
</div>

<div class="content" id="mainContent"></div>

// 当前语言
let currentLang = localStorage.getItem('qt_lang') || "zh-CN";

// 获取文字
function getLangTxt(key){
    return langData[currentLang][key] || key;
}

// 全局渲染语言
function renderAllLang(){
    document.querySelectorAll('[data-lang]').forEach(el=>{
        let k = el.getAttribute('data-lang');
        el.innerText = getLangTxt(k);
    });
    document.querySelectorAll('[data-lang-placeholder]').forEach(el=>{
        let k = el.getAttribute('data-lang-placeholder');
        el.placeholder = getLangTxt(k);
    });
    document.documentElement.lang = currentLang;
}

// 切换语言并缓存
function setLang(lang){
    currentLang = lang;
    localStorage.setItem('qt_lang',lang);
    renderAllLang();
    renderPage(currPage,currActiveEl);
}

// ========== 全局变量 ==========
let currPage = "trade-hall";
let currActiveEl = null;

// 菜单折叠
function toggleSub(num){
    document.querySelectorAll('.submenu').forEach(el=>el.classList.remove('show'));
    document.getElementById('sub'+num).classList.add('show');
    document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.menu-item')[num-1].classList.add('active');
}

// 页面渲染
function renderPage(pageName, el){
    currPage = pageName;
    currActiveEl = el;
    document.querySelectorAll('.submenu-item').forEach(i=>i.classList.remove('active'));
    if(el) el.classList.add('active');
    let html = '';

    // 交易市场
    if(pageName==="trade-hall"){
        html=`<div class="page-title">${getLangTxt('m1_1')}</div>
        <div class="tv-container" id="tv1"></div>
        <div class="card"><p class="form-label">${getLangTxt('webhook_txt')}</p>
        <input value="https://quantsignalkitokito.duckdns.org/api/webhook/trade" readonly>
        <button onclick="copyWebhook()">${getLangTxt('copy')}</button></div>`;
    }
    if(pageName==="crypto-market") html=`<div class="page-title">${getLangTxt('m1_2')}</div><div class="tv-container" id="tv2"></div>`;
    if(pageName==="forex-metal") html=`<div class="page-title">${getLangTxt('m1_3')}</div><div class="tv-container" id="tv3"></div>`;
    if(pageName==="future-market") html=`<div class="page-title">${getLangTxt('m1_4')}</div><div class="tv-container" id="tv4"></div>`;
    if(pageName==="kline-pro") html=`<div class="page-title">${getLangTxt('m1_5')}</div><div class="tv-container" id="tv5"></div>`;

    // 交易社区
    if(pageName==="dynamic-square") html=`<div class="page-title">${getLangTxt('m2_1')}</div><div class="post-card">Content</div>`;
    if(pageName==="strategy-square") html=`<div class="page-title">${getLangTxt('m2_2')}</div><div class="grid3"><div class="card"><button>View</button></div></div>`;
    if(pageName==="backtest-center") html=`<div class="page-title">${getLangTxt('m2_3')}</div><div class="card"><button>Start</button></div>`;
    if(pageName==="ranking-list") html=`<div class="page-title">${getLangTxt('m2_4')}</div><div class="card">Rank List</div>`;
    if(pageName==="copy-trade") html=`<div class="page-title">${getLangTxt('m2_5')}</div><div class="card"><button>Open</button></div>`;
    if(pageName==="trade-live") html=`<div class="page-title">${getLangTxt('m2_6')}</div><div class="card">Live Trading</div>`;

    // 频道
    if(pageName==="create-channel"){
        html=`<div class="page-title">${getLangTxt('m3_1')}</div><div class="card">
        <label class="form-label">${getLangTxt('channel_name')}</label><input>
        <label class="form-label">${getLangTxt('channel_type')}</label><select>
        <option>Text</option><option>Voice</option><option>Video</option></select>
        <button onclick="alert('OK')">${getLangTxt('create')}</button></div>`;
    }
    if(pageName==="text-channel") html=`<div class="page-title">${getLangTxt('m3_2')}</div><div class="chat-box"></div><input><button>Send</button>`;
    if(pageName==="voice-channel"){
        html=`<div class="page-title">${getLangTxt('m3_3')}</div><div class="card">
        <div class="voice-controls">
            <button class="voice-btn">${getLangTxt('mic')}</button>
            <button class="voice-btn active">${getLangTxt('mute')}</button>
            <button class="voice-btn">${getLangTxt('leave')}</button>
        </div></div>`;
    }
    if(pageName==="video-channel"){
        html=`<div class="page-title">${getLangTxt('m3_4')}</div>
        <div class="card" style="height:400px;display:flex;align-items:center;justify-content:center;">Stream / Share</div>
        <div class="voice-controls">
        <button class="voice-btn">${getLangTxt('camera')}</button>
        <button class="voice-btn active">${getLangTxt('share_screen')}</button>
        <button class="voice-btn">${getLangTxt('leave')}</button>
        </div>`;
    }
    if(pageName==="signal-channel") html=`<div class="page-title">${getLangTxt('m3_5')}</div><div class="card">Signal Push</div>`;
    if(pageName==="official-channel") html=`<div class="page-title">${getLangTxt('m3_6')}</div><div class="card">Announcement</div>`;

    // 社交
    if(pageName==="private-chat") html=`<div class="page-title">${getLangTxt('m4_1')}</div><div class="chat-box"></div>`;
    if(pageName==="friend-list") html=`<div class="page-title">${getLangTxt('m4_2')}</div><div class="card">Friend List</div>`;
    if(pageName==="private-group") html=`<div class="page-title">${getLangTxt('m4_3')}</div><div class="card">Group Chat</div>`;

    // 个人中心-语言设置
    if(pageName==="user-info") html=`<div class="page-title">${getLangTxt('m5_1')}</div><div class="card"><textarea></textarea><button>${getLangTxt('save')}</button></div>`;
    if(pageName==="lang-setting"){
        html=`<div class="page-title">${getLangTxt('lang_title')}</div><div class="card">
        <label class="form-label">${getLangTxt('lang_select')}</label>
        <select id="langSelect" onchange="setLang(this.value)">
            <option value="zh-CN" ${currentLang==='zh-CN'?'selected':''}>中文（简体）</option>
            <option value="en" ${currentLang==='en'?'selected':''}>English</option>
            <option value="ja" ${currentLang==='ja'?'selected':''}>日本語</option>
            <option value="ko" ${currentLang==='ko'?'selected':''}>한국어</option>
            <option value="zh-TW" ${currentLang==='zh-TW'?'selected':''}>繁体中文(台湾)</option>
            <option value="yue" ${currentLang==='yue'?'selected':''}>粤语</option>
            <option value="ar" ${currentLang==='ar'?'selected':''}>العربية</option>
            <option value="ms" ${currentLang==='ms'?'selected':''}>Bahasa Melayu</option>
            <option value="id" ${currentLang==='id'?'selected':''}>Bahasa Indonesia</option>
            <option value="ru" ${currentLang==='ru'?'selected':''}>Русский</option>
            <option value="fr" ${currentLang==='fr'?'selected':''}>Français</option>
            <option value="de" ${currentLang==='de'?'selected':''}>Deutsch</option>
            <option value="es" ${currentLang==='es'?'selected':''}>Español</option>
            <option value="pt" ${currentLang==='pt'?'selected':''}>Português</option>
        </select>
        <p class="tip">${getLangTxt('lang_tip')}</p>
        <button onclick="alert(getLangTxt('save')+' OK')">${getLangTxt('save')}</button>
        </div>`;
    }

function switchTab(t){
    document.getElementById('loginForm').style.display=t==='login'?'block':'none';
    document.getElementById('registerForm').style.display=t==='login'?'none':'block';
    document.querySelectorAll('.tab-btn')[0].classList.toggle('active',t==='login');

// 关闭登录弹窗

    document.getElementById('loginModal').style.display='none';
}

// 显示登录弹窗
function showLoginModal(){
    document.getElementById('loginModal').style.display='flex';
}

// API 请求辅助函数
async function api(url, opts={}){
    const baseUrl = '';
    const res = await fetch(baseUrl+url, {
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${S.token||''}`},
        ...opts
    });
    if(res.status===204) return {};
    const ct=res.headers.get('content-type')||'';
    return ct.includes('json')?res.json():res.text();
}

// 账号登录
async function doAccountLogin(){
    const account=document.getElementById('login-account').value.trim();
    const password=document.getElementById('login-password').value;
    if(!account||!password){alert('请输入账号和密码');return;}
    try{
        const r=await api('/auth/login',{method:'POST',body:JSON.stringify({username:account,password})});
        if(r?.access_token){
            S.token=r.access_token;
            S.user=r.user;
            localStorage.setItem('qt_token',S.token);
            localStorage.setItem('qt_user',JSON.stringify(S.user));
            closeModal();
            alert('登录成功！');
            renderPage(S.currentPage||'trade-hall');
        } else {
            alert(r?.detail||'登录失败，请检查账号密码');
        }
    } catch(e){alert('登录失败：'+e.message);}
}

// 账号注册
async function doAccountRegister(){
    const username=document.getElementById('reg-username').value.trim();
    const email=document.getElementById('reg-email').value.trim();
    const password=document.getElementById('reg-password').value;
    if(!username||!email||!password){alert('请填写所有字段');return;}
    if(password.length<6){alert('密码至少6位');return;}
    try{
        const r=await api('/auth/register',{method:'POST',body:JSON.stringify({username,email,password})});
        if(r?.access_token){
            S.token=r.access_token;
            S.user=r.user;
            localStorage.setItem('qt_token',S.token);
            localStorage.setItem('qt_user',JSON.stringify(S.user));
            closeModal();
            alert('注册成功！');
            renderPage(S.currentPage||'trade-hall');
        } else {
            alert(r?.detail||'注册失败');
        }
    } catch(e){alert('注册失败：'+e.message);}
}
