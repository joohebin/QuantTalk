<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTalk - 量化交易社交平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 50:'#f8fafc', 100:'#e2e8f0', 200:'#cbd5e1', 300:'#94a3b8', 400:'#64748b', 500:'#475569', 600:'#334155', 700:'#1e293b', 800:'#141c2e', 900:'#0b1120', 950:'#060a14' },
                        accent: { 400:'#38bdf8', 500:'#0ea5e9', 600:'#0284c7' },
                        gain: '#22c55e', loss: '#ef4444',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        body { background: #060a14; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 28, 46, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(100,116,139,0.15); }
        .glow { box-shadow: 0 0 20px rgba(14,165,233,0.15); }
        .tag { background: rgba(14,165,233,0.15); color: #38bdf8; border: 1px solid rgba(14,165,233,0.25); }
        .gain-text { color: #22c55e; }
        .loss-text { color: #ef4444; }
        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14,165,233,0.4); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        textarea:focus, input:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 2px rgba(14,165,233,0.2); }
    </style>
</head>
<body class="min-h-screen">
    <!-- Nav -->
    <nav class="glass sticky top-0 z-50 border-b border-dark-700/50">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="#" onclick="navigate('feed')" class="flex items-center gap-2 text-xl font-bold">
                    <span class="text-accent-400">⚡</span> QuantTalk
                </a>
                <div class="hidden md:flex items-center gap-6 text-sm">
                    <a href="#" onclick="navigate('feed')" class="nav-link text-dark-300 hover:text-white transition" data-page="feed">首页</a>
                    <a href="#" onclick="navigate('market')" class="nav-link text-dark-300 hover:text-white transition" data-page="market">行情</a>
                    <a href="#" onclick="navigate('discover')" class="nav-link text-dark-300 hover:text-white transition" data-page="discover">发现</a>
                </div>
            </div>
            <div id="nav-auth" class="flex items-center gap-3">
                <!-- Dynamic auth buttons -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Left Sidebar -->
            <aside class="hidden lg:block lg:col-span-1 order-2 lg:order-1 space-y-4" id="sidebar-left">
                <!-- User card (logged in) -->
                <div id="user-card" class="hidden"></div>
                <!-- Trending tags -->
                <div class="glass rounded-xl p-4">
                    <h3 class="font-semibold text-sm text-dark-300 mb-3">🔥 热门标签</h3>
                    <div id="trending-tags" class="flex flex-wrap gap-2">
                        <span class="tag text-xs px-2.5 py-1 rounded-full">加载中...</span>
                    </div>
                </div>
                <!-- Quick links -->
                <div class="glass rounded-xl p-4 text-sm text-dark-400 space-y-2">
                    <p>📊 QuantTalk v2.0</p>
                    <p>量化交易者的社交平台</p>
                    <p class="text-xs text-dark-500">© 2024 QuantTalk</p>
                </div>
            </aside>

            <!-- Center Feed -->
            <div class="lg:col-span-2 order-1 lg:order-2" id="main-content">
                <!-- Dynamic content loaded here -->
            </div>

            <!-- Right Sidebar -->
            <aside class="hidden lg:block lg:col-span-1 order-3 space-y-4" id="sidebar-right">
                <!-- Market Overview -->
                <div class="glass rounded-xl p-4">
                    <h3 class="font-semibold text-sm text-dark-300 mb-3">📈 市场概况</h3>
                    <div id="market-mini" class="space-y-2 text-sm">
                        <p class="text-dark-500">加载中...</p>
                    </div>
                </div>
                <!-- Hot stocks -->
                <div class="glass rounded-xl p-4">
                    <h3 class="font-semibold text-sm text-dark-300 mb-3">🏷️ 热门股票</h3>
                    <div id="hot-stocks-mini" class="space-y-2 text-sm">
                        <p class="text-dark-500">加载中...</p>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="glass rounded-2xl w-full max-w-md p-6 fade-in" id="modal-content"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-[200] space-y-2"></div>

    <script>
    // ============ State ============
    const state = {
        token: localStorage.getItem('qt_token') || null,
        user: JSON.parse(localStorage.getItem('qt_user') || 'null'),
        currentPage: 'feed',
        posts: [],
        page: 1,
    };

    const API = '/api';

    // ============ API Helpers ============
    async function api(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
        const res = await fetch(API + path, { ...options, headers });
        if (res.status === 401 && !path.includes('/auth/login')) {
            logout();
            return null;
        }
        return res.json();
    }

    function toast(msg, type = 'info') {
        const el = document.createElement('div');
        const colors = { info: 'bg-accent-600', success: 'bg-gain', error: 'bg-loss' };
        el.className = `${colors[type] || colors.info} text-white px-4 py-2 rounded-lg shadow-lg text-sm fade-in`;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    // ============ Auth ============
    function logout() {
        state.token = null;
        state.user = null;
        localStorage.removeItem('qt_token');
        localStorage.removeItem('qt_user');
        renderNav();
        navigate(state.currentPage);
    }

    function showModal(html) {
        document.getElementById('modal-content').innerHTML = html;
        document.getElementById('modal-container').classList.remove('hidden');
    }

    function hideModal() {
        document.getElementById('modal-container').classList.add('hidden');
    }

    document.getElementById('modal-container').addEventListener('click', (e) => {
        if (e.target.id === 'modal-container') hideModal();
    });

    // ============ Auth Modal ============
    function showAuthModal(tab = 'login') {
        showModal(`
            <div class="flex gap-4 mb-6 border-b border-dark-700 pb-3">
                <button onclick="showAuthModal('login')" class="pb-2 font-medium text-sm ${tab==='login'?'text-accent-400 border-b-2 border-accent-400':'text-dark-400'}">登录</button>
                <button onclick="showAuthModal('register')" class="pb-2 font-medium text-sm ${tab==='register'?'text-accent-400 border-b-2 border-accent-400':'text-dark-400'}">注册</button>
            </div>
            <form onsubmit="handleAuth(event, '${tab}')" class="space-y-4">
                ${tab==='register'?'<div><label class="text-xs text-dark-400 block mb-1">用户名</label><input name="username" required class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-sm" placeholder="取一个独特的名字"></div>':''}
                ${tab==='register'?'<div><label class="text-xs text-dark-400 block mb-1">邮箱</label><input name="email" type="email" required class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-sm" placeholder="your@email.com"></div>':''}
                <div><label class="text-xs text-dark-400 block mb-1">用户名</label><input name="username" required class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-sm" placeholder="输入用户名"></div>
                <div><label class="text-xs text-dark-400 block mb-1">密码</label><input name="password" type="password" required class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-sm" placeholder="输入密码"></div>
                <button type="submit" class="btn-primary w-full py-2.5 rounded-lg text-white font-medium text-sm">${tab==='login'?'登录':'注册'}</button>
            </form>
        `);
    }

    async function handleAuth(e, mode) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        try {
            const res = await api(`/auth/${mode}`, { method: 'POST', body: JSON.stringify(data) });
            if (res.access_token) {
                state.token = res.access_token;
                state.user = res.user;
                localStorage.setItem('qt_token', res.access_token);
                localStorage.setItem('qt_user', JSON.stringify(res.user));
                hideModal();
                renderNav();
                navigate(state.currentPage);
                toast(mode === 'login' ? '登录成功' : '注册成功，欢迎加入！', 'success');
            } else {
                toast(res.detail || '操作失败', 'error');
            }
        } catch (err) {
            toast('网络错误', 'error');
        }
    }

    // ============ Navigation ============
    function navigate(page) {
        state.currentPage = page;
        document.querySelectorAll('.nav-link').forEach(l => {
            l.classList.toggle('text-white', l.dataset.page === page);
            l.classList.toggle('text-dark-300', l.dataset.page !== page);
        });
        render();
    }

    async function render() {
        const main = document.getElementById('main-content');
        switch (state.currentPage) {
            case 'feed': await renderFeed(main); break;
            case 'market': await renderMarket(main); break;
            case 'discover': await renderDiscover(main); break;
            default: await renderFeed(main);
        }
    }

    // ============ Feed ============
    async function renderFeed(el) {
        // Post form
        let form = '';
        if (state.user) {
            form = `
                <div class="glass rounded-xl p-4 mb-4 fade-in">
                    <textarea id="post-content" class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-sm resize-none" rows="3" placeholder="分享你的交易策略、市场观点..."></textarea>
                    <div class="flex items-center justify-between mt-3">
                        <input id="post-tags" class="bg-dark-800 border border-dark-700 rounded-lg px-3 py-1.5 text-xs w-48" placeholder="标签，逗号分隔，如：量化策略,A股">
                        <button onclick="submitPost()" class="btn-primary px-5 py-1.5 rounded-lg text-white text-sm font-medium">发布</button>
                    </div>
                </div>`;
        }

        const res = await api('/posts/');
        const posts = res?.posts || [];
        const cards = posts.length ? posts.map(renderPostCard).join('') : '<p class="text-dark-500 text-center py-12">暂无动态，成为第一个发言的人吧 🚀</p>';

        el.innerHTML = form + `<div class="space-y-4">${cards}</div>`;
    }

    function renderPostCard(post) {
        const author = post.author || {};
        const tags = post.tags ? post.tags.split(',').map(t => t.trim()).filter(Boolean).map(t => `<span class="tag text-xs px-2 py-0.5 rounded-full">${t}</span>`).join('') : '';
        const time = new Date(post.created_at).toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
        const likeIcon = post.is_liked ? '❤️' : '🤍';
        const likeClass = post.is_liked ? 'text-red-400' : 'text-dark-400';

        return `
        <article class="glass rounded-xl p-5 fade-in hover:border-accent-500/20 transition">
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-accent-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
                    ${(author.username||'?')[0].toUpperCase()}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                        <span class="font-semibold text-sm">${author.username||'匿名'}</span>
                        <span class="text-xs text-dark-500">${time}</span>
                    </div>
                    ${post.title ? `<h3 class="font-semibold mt-1 text-white">${escHtml(post.title)}</h3>` : ''}
                    <p class="mt-1.5 text-sm text-dark-200 leading-relaxed">${escHtml(post.content)}</p>
                    ${tags ? `<div class="flex flex-wrap gap-1.5 mt-3">${tags}</div>` : ''}
                    <div class="flex items-center gap-5 mt-3 text-sm">
                        <button onclick="toggleLike(${post.id})" class="${likeClass} hover:text-red-400 transition flex items-center gap-1">
                            ${likeIcon} ${post.likes_count||0}
                        </button>
                        <button onclick="showComments(${post.id})" class="text-dark-400 hover:text-accent-400 transition flex items-center gap-1">
                            💬 ${post.comments_count||0}
                        </button>
                        <span class="text-dark-500 flex items-center gap-1">👁 ${post.views||0}</span>
                    </div>
                </div>
            </div>
            <div id="comments-${post.id}" class="hidden mt-4 pl-13 border-t border-dark-700/50 pt-3"></div>
        </article>`;
    }

    async function submitPost() {
        const content = document.getElementById('post-content').value.trim();
        const tags = document.getElementById('post-tags').value.trim();
        if (!content) return toast('请输入内容', 'error');
        const res = await api('/posts/', { method: 'POST', body: JSON.stringify({ content, tags }) });
        if (res?.id) {
            toast('发布成功！', 'success');
            render();
        } else {
            toast(res?.detail || '发布失败', 'error');
        }
    }

    async function toggleLike(postId) {
        const res = await api(`/posts/${postId}/like`, { method: 'POST' });
        if (res) render();
    }

    async function showComments(postId) {
        const el = document.getElementById(`comments-${postId}`);
        if (!el.classList.contains('hidden')) { el.classList.add('hidden'); return; }
        el.classList.remove('hidden');

        let html = '<div class="space-y-3" id="comments-list-' + postId + '"><p class="text-dark-500 text-sm">加载中...</p></div>';
        if (state.user) {
            html += `<form onsubmit="submitComment(event, ${postId})" class="mt-3 flex gap-2">
                <input name="content" required class="flex-1 bg-dark-800 border border-dark-700 rounded-lg px-3 py-1.5 text-sm" placeholder="写评论...">
                <button type="submit" class="btn-primary px-3 py-1.5 rounded-lg text-white text-xs">发送</button>
            </form>`;
        }
        el.innerHTML = html;

        const res = await api(`/posts/${postId}/comments`);
        const comments = res || [];
        const listEl = document.getElementById(`comments-list-${postId}`);
        listEl.innerHTML = comments.length ? comments.map(c => `
            <div class="flex gap-2 text-sm">
                <div class="w-6 h-6 rounded-full bg-dark-700 flex items-center justify-center text-xs font-bold flex-shrink-0">${(c.author?.username||'?')[0].toUpperCase()}</div>
                <div>
                    <span class="font-medium">${c.author?.username||'匿名'}</span>
                    <span class="text-dark-500 text-xs ml-1">${new Date(c.created_at).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
                    <p class="text-dark-200 mt-0.5">${escHtml(c.content)}</p>
                </div>
            </div>
        `).join('') : '<p class="text-dark-500 text-sm">暂无评论</p>';
    }

    async function submitComment(e, postId) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const res = await api(`/posts/${postId}/comments`, { method: 'POST', body: JSON.stringify({ content: fd.get('content') }) });
        if (res?.id) {
            toast('评论成功', 'success');
            showComments(postId);
        }
    }

    // ============ Market ============
    async function renderMarket(el) {
        const [indicesRes, stocksRes] = await Promise.all([api('/market/indices'), api('/market/hot-stocks')]);
        const indices = indicesRes?.indices || [];
        const stocks = stocksRes?.stocks || [];

        el.innerHTML = `
        <div class="fade-in space-y-4">
            <h2 class="text-lg font-bold">📈 市场行情</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                ${indices.map(idx => `
                    <div class="glass rounded-xl p-4">
                        <div class="text-xs text-dark-400">${idx.name}</div>
                        <div class="text-lg font-bold mt-1">${idx.price.toLocaleString()}</div>
                        <div class="text-sm ${idx.change>=0?'gain-text':'loss-text'}">
                            ${idx.change>=0?'↑':'↓'} ${idx.change>=0?'+':''}${idx.change} (${idx.change_pct>=0?'+':''}${idx.change_pct.toFixed(2)}%)
                        </div>
                    </div>
                `).join('')}
            </div>
            <h2 class="text-lg font-bold mt-6">🏷️ 热门股票</h2>
            <div class="glass rounded-xl overflow-hidden">
                <table class="w-full text-sm">
                    <thead><tr class="text-dark-400 text-xs border-b border-dark-700">
                        <th class="text-left p-3">名称</th><th class="text-left p-3">代码</th>
                        <th class="text-right p-3">价格</th><th class="text-right p-3">涨跌%</th>
                    </tr></thead>
                    <tbody>
                        ${stocks.map(s => `
                            <tr class="border-b border-dark-700/50 hover:bg-dark-800/50">
                                <td class="p-3 font-medium">${s.name}</td>
                                <td class="p-3 text-dark-400">${s.code}</td>
                                <td class="p-3 text-right">${s.price}</td>
                                <td class="p-3 text-right ${s.change_pct>=0?'gain-text':'loss-text'}">${s.change_pct>=0?'+':''}${s.change_pct.toFixed(2)}%</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    }

    // ============ Discover ============
    async function renderDiscover(el) {
        const tagsRes = await api('/market/trending-tags');
        const tags = tagsRes?.tags || [];

        el.innerHTML = `
        <div class="fade-in space-y-4">
            <h2 class="text-lg font-bold">🔍 发现</h2>
            <div class="glass rounded-xl p-5">
                <h3 class="font-semibold text-sm mb-3">热门话题</h3>
                <div class="space-y-3">
                    ${tags.map((t,i) => `
                        <div class="flex items-center justify-between py-2 ${i<tags.length-1?'border-b border-dark-700/50':''}">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold ${i<3?'text-accent-400':'text-dark-500'} w-5">#${i+1}</span>
                                <span class="tag text-sm px-3 py-1 rounded-full cursor-pointer">${t.name}</span>
                            </div>
                            <span class="text-xs text-dark-500">${t.count} 讨论</span>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="glass rounded-xl p-5">
                <h3 class="font-semibold text-sm mb-3">💡 平台功能</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="bg-dark-800/50 rounded-lg p-4 border border-dark-700/50">
                        <div class="text-lg mb-1">📊</div>
                        <div class="font-medium text-sm">策略分享</div>
                        <div class="text-xs text-dark-400 mt-1">分享你的量化交易策略，获取社区反馈</div>
                    </div>
                    <div class="bg-dark-800/50 rounded-lg p-4 border border-dark-700/50">
                        <div class="text-lg mb-1">💬</div>
                        <div class="font-medium text-sm">实时讨论</div>
                        <div class="text-xs text-dark-400 mt-1">与全球量化交易者交流市场观点</div>
                    </div>
                    <div class="bg-dark-800/50 rounded-lg p-4 border border-dark-700/50">
                        <div class="text-lg mb-1">📈</div>
                        <div class="font-medium text-sm">行情追踪</div>
                        <div class="text-xs text-dark-400 mt-1">实时掌握全球市场动态</div>
                    </div>
                    <div class="bg-dark-800/50 rounded-lg p-4 border border-dark-700/50">
                        <div class="text-lg mb-1">🤝</div>
                        <div class="font-medium text-sm">社区关注</div>
                        <div class="text-xs text-dark-400 mt-1">关注优秀的交易者，学习交流</div>
                    </div>
                </div>
            </div>
        </div>`;
    }

    // ============ Sidebar Widgets ============
    async function loadSidebarData() {
        try {
            const [indices, stocks, tags] = await Promise.all([
                api('/market/indices'), api('/market/hot-stocks'), api('/market/trending-tags')
            ]);

            // Market mini
            const indicesHtml = (indices?.indices || []).slice(0, 4).map(idx => `
                <div class="flex justify-between items-center">
                    <span class="text-dark-300">${idx.name}</span>
                    <span class="${idx.change>=0?'gain-text':'loss-text'}">${idx.change_pct>=0?'+':''}${idx.change_pct.toFixed(2)}%</span>
                </div>
            `).join('');
            if (indicesHtml) document.getElementById('market-mini').innerHTML = indicesHtml;

            // Hot stocks mini
            const stocksHtml = (stocks?.stocks || []).slice(0, 5).map(s => `
                <div class="flex justify-between items-center">
                    <span class="text-dark-300">${s.name}</span>
                    <span class="${s.change_pct>=0?'gain-text':'loss-text'}">${s.change_pct>=0?'+':''}${s.change_pct.toFixed(2)}%</span>
                </div>
            `).join('');
            if (stocksHtml) document.getElementById('hot-stocks-mini').innerHTML = stocksHtml;

            // Tags
            const tagsHtml = (tags?.tags || []).slice(0, 8).map(t =>
                `<span class="tag text-xs px-2.5 py-1 rounded-full cursor-pointer">${t.name}</span>`
            ).join('');
            if (tagsHtml) document.getElementById('trending-tags').innerHTML = tagsHtml;
        } catch(e) {}
    }

    // ============ Nav Render ============
    function renderNav() {
        const el = document.getElementById('nav-auth');
        const userCard = document.getElementById('user-card');
        if (state.user) {
            el.innerHTML = `
                <span class="text-sm text-dark-300 hidden md:inline">👋 ${state.user.username}</span>
                <button onclick="logout()" class="text-xs text-dark-400 hover:text-white transition">退出</button>
            `;
            userCard.classList.remove('hidden');
            userCard.innerHTML = `
                <div class="glass rounded-xl p-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-accent-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg">${state.user.username[0].toUpperCase()}</div>
                        <div>
                            <div class="font-semibold">${state.user.username}</div>
                            <div class="text-xs text-dark-400">${state.user.bio || '量化交易爱好者'}</div>
                        </div>
                    </div>
                </div>`;
        } else {
            el.innerHTML = `
                <button onclick="showAuthModal('login')" class="text-sm text-dark-300 hover:text-white transition">登录</button>
                <button onclick="showAuthModal('register')" class="btn-primary px-4 py-1.5 rounded-lg text-white text-sm">注册</button>
            `;
            userCard.classList.add('hidden');
        }
    }

    // ============ Utils ============
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // ============ Init ============
    renderNav();
    loadSidebarData();
    render();
    </script>
</body>
</html>
