<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTalk</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        body { background:#121314; color:#fff; height:100vh; display:flex; overflow:hidden; }
        .hide { display:none !important; }

        /* 🔴 核心加固：给所有侧边栏加固定宽度 + flex-shrink:0，禁止被挤压 */
        .server-bar  {
            width:72px;
            flex: 0 0 72px; /* 固定宽度，不收缩不放大 */
            background:#1e1f22;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:12px 0;
            border-right:1px solid #2f3136;
        }
        .channel-bar {
            width:260px;
            flex: 0 0 260px; /* 固定宽度，不收缩不放大 */
            background:#1e1f22;
            border-right:1px solid #2f3136;
            overflow-y:auto;
            word-break: break-word; /* 防止长文字溢出 */
        }
        .right-panel{
            width:280px;
            flex: 0 0 280px; /* 固定宽度，不收缩不放大 */
            background:#1e1f22;
            border-left:1px solid #2f3136;
            padding:16px;
            overflow-y:auto;
        }
        .main-content {
            flex: 1 1 auto; /* 只让主内容区可伸缩 */
            display:flex;
            flex-direction:column;
            min-width:0; /* 允许主内容区压缩 */
        }

        .server-icon { width:48px; height:48px; border-radius:50%; background:#f9a825; margin-bottom:12px; display:grid; place-items:center; font-weight:bold; cursor:pointer; }
        .server-name { padding:16px; font-size:18px; border-bottom:1px solid #2f3136; display:flex; justify-content:space-between; align-items:center; }
        .channel-category { padding:12px 16px; font-size:12px; color:#aaa; text-transform:uppercase; }
        .channel-item { padding:10px 16px; color:#ccc; cursor:pointer; border-radius:4px; margin:2px 8px; display:flex; align-items:center; gap:8px; }
        .channel-item:hover,.channel-item.active { background:#2f3136; color:#fff; }

        .auth-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; display:flex; align-items:center; justify-content:center; }
        .auth-box { width:420px; background:#1e1f22; border-radius:12px; padding:30px; border:1px solid #333; }
        .tab-bar { display:flex; gap:8px; margin-bottom:16px; }
        .tab { flex:1; text-align:center; padding:10px; background:#292a2d; border-radius:6px; cursor:pointer; }
        .tab.active { background:#f9a825; color:#000; }
        input, button { width:100%; padding:12px; border-radius:6px; border:1px solid #444; background:#292a2d; color:#fff; outline:none; margin:6px 0; }
        button { background:#f9a825; color:#000; font-weight:bold; border:none; cursor:pointer; }

        .top-bar { height:48px; background:#1e1f22; border-bottom:1px solid #2f3136; display:flex; align-items:center; padding:0 16px; justify-content:space-between; }
        .lang-select { background:#2f3136; color:#fff; border:none; padding:6px 10px; border-radius:4px; outline:none; }
        .content-area { flex:1; padding:20px; overflow-y:auto; }
        .card { background:#1e1f22; border-radius:8px; padding:16px; margin-bottom:16px; border:1px solid #2f3136; }
        #tvChart { width:100%; height:450px; margin:12px 0; border-radius:8px; overflow:hidden; }

        .chat-input-area { background:#1e1f22; padding:12px; border-top:1px solid #2f3136; display:flex; gap:8px; align-items:center; }
        .chat-insert-btn { width:40px; height:40px; background:#2f3136; border-radius:6px; display:grid; place-items:center; cursor:pointer; color:#f9a825; font-size:18px; }

        .voice-bar { position:fixed; bottom:0; left:72px; width:260px; height:60px; background:#1e1f22; border-top:1px solid #2f3136; display:flex; align-items:center; padding:0 16px; gap:12px; }
        .voice-btn { width:36px; height:36px; border-radius:50%; background:#2f3136; display:grid; place-items:center; cursor:pointer; }
    </style>
</head>
<body>

<div class="auth-modal" id="authModal">
    <div class="auth-box">
        <div style="color:#f9a825;font-size:24px;text-align:center;margin-bottom:20px;">QuantTalk</div>
        <div class="tab-bar">
            <div class="tab active" onclick="switchAuthTab('login')" id="tabLogin">登录</div>
            <div class="tab" onclick="switchAuthTab('register')" id="tabRegister">注册</div>
        </div>
        <div id="loginForm">
            <input id="loginEmail" placeholder="邮箱">
            <input id="loginPwd" placeholder="密码" type="password">
            <button onclick="handleLogin()">登录</button>
        </div>
        <div id="registerForm" class="hide">
            <input id="regEmail" placeholder="邮箱">
            <input id="regPwd" placeholder="密码" type="password">
            <button onclick="handleRegister()">注册</button>
        </div>
    </div>
</div>

<div class="server-bar">
    <div class="server-icon">QT</div>
    <div class="server-icon" onclick="openProfile()">👤</div>
</div>

<div class="channel-bar">
    <div class="server-name">
        <span>QuantTalk</span>
        <span style="color:#f9a825;cursor:pointer;" onclick="showCreateChannel()">+</span>
    </div>
    <div style="padding:10px;">
        <input id="searchInput" placeholder="搜索频道" oninput="filterChannels(this.value)" style="width:100%;background:#292a2d;border:1px solid #444;border-radius:6px;padding:8px;color:#fff;">
    </div>
    <div class="channel-category">交易专区</div>
    <div class="channel-item active" onclick="openChannel('trade')">💬 BTC行情交流</div>
    <div class="channel-item" onclick="openChannel('voice')">🔊 交易连麦</div>
</div>

<div class="main-content">
    <div class="top-bar">
        <div id="pageTitle">BTC行情交流</div>
        <div style="display:flex;gap:12px;align-items:center;">
            <select class="lang-select" id="langSelect">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
            <button id="btnProfile">个人中心</button>
        </div>
    </div>

    <div class="content-area" id="contentArea">
        <div class="card">
            <div id="welcomeText">欢迎进入量化交易社区</div>
            <div id="tvChart"></div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="chat-insert-btn" onclick="openQuantWidget()">📊</div>
        <input id="chatInput" placeholder="发送消息..." style="flex:1;border:none;background:#292a2d;color:#fff;padding:10px;border-radius:6px;">
        <button id="sendBtn">发送</button>
    </div>
</div>

<div class="right-panel"></div>

<div class="voice-bar hide" id="voiceBar">
    <div class="voice-btn">🎤</div>
    <div class="voice-btn">🔊</div>
    <div class="voice-btn" onclick="leaveVoice()">❌</div>
</div>

<script>
// =====================================
// 1. 纯手写硬编码翻译 【无任何插件】
// =====================================
const langData = {
    "zh-CN": {
        login:"登录",register:"注册",emailTip:"邮箱",pwdTip:"密码",
        search:"搜索频道",center:"个人中心",send:"发送",
        chatTip:"发送消息...",welcome:"欢迎进入量化交易社区",
        widgetTip:"行情/K线组件已嵌入"
    },
    "zh-TW": {
        login:"登入",register:"註冊",emailTip:"信箱",pwdTip:"密碼",
        search:"搜尋頻道",center:"個人中心",send:"傳送",
        chatTip:"傳送訊息...",welcome:"歡迎進入量化交易社群",
        widgetTip:"行情/K線組件已嵌入"
    },
    "en": {
        login:"Login",register:"Register",emailTip:"Email",pwdTip:"Password",
        search:"Search Channel",center:"Profile",send:"Send",
        chatTip:"Type message...",welcome:"Welcome to Quant Community",
        widgetTip:"Kline widget inserted"
    },
    "ja": {
        login:"ログイン",register:"新規登録",emailTip:"メール",pwdTip:"パスワード",
        search:"チャンネル検索",center:"プロフィール",send:"送信",
        chatTip:"メッセージ入力",welcome:"量化コミュニティへようこそ",
        widgetTip:"チャート挿入完了"
    },
    "ko": {
        login:"로그인",register:"회원가입",emailTip:"이메일",pwdTip:"비밀번호",
        search:"채널 검색",center:"프로필",send:"보내기",
        chatTip:"메시지 입력",welcome:"퀀트 커뮤니티 환영",
        widgetTip:"차트 삽입 완료"
    }
};

// 本地储存 干净版
let nowLang = localStorage.getItem("qt_lang") || "zh-CN";

// 全局渲染文字
function renderAllText(){
    const t = langData[nowLang];
    document.getElementById("tabLogin").innerText = t.login;
    document.getElementById("tabRegister").innerText = t.register;
    document.getElementById("loginEmail").placeholder = t.emailTip;
    document.getElementById("loginPwd").placeholder = t.pwdTip;
    document.getElementById("regEmail").placeholder = t.emailTip;
    document.getElementById("regPwd").placeholder = t.pwdTip;
    document.getElementById("searchInput").placeholder = t.search;
    document.getElementById("btnProfile").innerText = t.center;
    document.getElementById("sendBtn").innerText = t.send;
    document.getElementById("chatInput").placeholder = t.chatTip;
    document.getElementById("welcomeText").innerText = t.welcome;
}

// 切换语言 + 保存
document.getElementById("langSelect").onchange = function(){
    nowLang = this.value;
    localStorage.setItem("qt_lang", nowLang);
    renderAllText();
};

// 初始化载入
document.getElementById("langSelect").value = nowLang;
renderAllText();

// =====================================
// 2. 登录/注册 百分百可用
// =====================================
function switchAuthTab(tab){
    if(tab === "login"){
        document.getElementById("loginForm").classList.remove("hide");
        document.getElementById("registerForm").classList.add("hide");
        document.getElementById("tabLogin").classList.add("active");
        document.getElementById("tabRegister").classList.remove("active");
    }else{
        document.getElementById("loginForm").classList.add("hide");
        document.getElementById("registerForm").classList.remove("hide");
        document.getElementById("tabLogin").classList.remove("active");
        document.getElementById("tabRegister").classList.add("active");
    }
}

function handleLogin(){
    document.getElementById("authModal").classList.add("hide");
}
function handleRegister(){
    alert(langData[nowLang].register+"成功");
    switchAuthTab("login");
}

// =====================================
// 3. K线 & 嵌入功能
// =====================================
new TradingView.widget({
    container: "tvChart",
    symbol: "BINANCE:BTCUSDT",
    width: "100%",
    height: "100%",
    theme: "dark",
    locale: nowLang
});

function openQuantWidget(){
    alert(langData[nowLang].widgetTip);
}

// 空占位函数不报错
function openChannel(){}
function leaveVoice(){}
function openProfile(){}
function filterChannels(){}
function showCreateChannel(){}
</script>

</body>
</html>
