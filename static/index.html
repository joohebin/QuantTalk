<style>
*{scrollbar-width:thin;scrollbar-color:#2d2d2d transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2d2d2d;border-radius:4px}
body{background:#1a1a1a;color:#dcddde;font-family:'Inter',sans-serif;margin:0;height:100vh;overflow:hidden}
.glass{background:rgba(15,20,25,.9);backdrop-filter:blur(12px);border:1px solid rgba(100,116,139,.1)}
.glass2{background:rgba(25,30,38,.7);border:1px solid rgba(100,116,139,.08)}
.tag{background:rgba(14,165,233,.12);color:#38bdf8;border:1px solid rgba(14,165,233,.2);border-radius:9999px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none;color:#fff}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7)}.btn-primary:hover{box-shadow:0 4px 14px rgba(14,165,233,.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#b9bbbe;border:1px solid #72767d}.btn-ghost:hover{color:#fff;border-color:#b9bbbe;background:rgba(79,84,92,.4)}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.25)}
.gain{color:#23a559}.loss{color:#ed4245}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}
.avatar-sm{width:24px;height:24px;font-size:10px}
.avatar-lg{width:56px;height:56px;font-size:22px}
.input{width:100%;background:#383842;border:1px solid #202225;border-radius:4px;padding:8px 12px;color:#dcddde;font-size:13px;outline:none;transition:border .2s}
.input:focus{border-color:#7289da;background:#404045}
.fade-in{animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#36393f;border:1px solid rgba(0,0,0,.2);border-radius:8px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;color:#dcddde}
.toast-wrap{position:fixed;top:70px;right:16px;z-index:200}
.toast{padding:10px 18px;border-radius:8px;color:#fff;font-size:13px;margin-bottom:8px;animation:fadeIn .2s}
.badge{position:absolute;top:-4px;right:-4px;background:#ed4245;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.divider{height:1px;background:rgba(79,84,92,.4);margin:8px 0}

/* ===== DISCORD LAYOUT ===== */
.discord-container{display:flex;height:100vh;overflow:hidden}

/* 服务器列表栏 (最左侧) */
.guilds-bar{width:72px;background:#1e1f22;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;overflow-y:auto}
.guild-icon{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .2s;background:#36393f;color:#fff;font-weight:600}
.guild-icon:hover{border-radius:16px}
.guild-icon.active{background:#5865f2;border-radius:16px}
.guild-icon.home{background:#5865f2}
.guild-divider{width:32px;height:2px;background:#202225;border-radius:1px}
.add-guild-btn{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:#23a559;color:#fff;transition:all .2s}
.add-guild-btn:hover{border-radius:16px;background:#2d8a4e}

/* 频道栏 */
.channels-bar{width:240px;background:#2b2d31;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.channels-header{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #202225;font-weight:600;font-size:15px;background:#2b2d31;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.channels-list{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:6px}
.channels-list::-webkit-scrollbar{width:4px}
.channels-list::-webkit-scrollbar-thumb{background:#36393f;border-radius:4px}
.channel-group{margin-bottom:8px}
.channel-group-header{display:flex;align-items:center;padding:8px 16px;font-size:11px;font-weight:700;text-transform:uppercase;color:#939ba2;cursor:pointer;user-select:none;transition:color .2s}
.channel-group-header:hover{color:#dcddde}
.channel-group-header .collapse-icon{margin-right:6px;font-size:10px;transition:transform .2s}
.channel-group-header.collapsed .collapse-icon{transform:rotate(-90deg)}
.channel-group-header.collapsed+*{display:none}
.channel-item{display:flex;align-items:center;padding:8px 16px;border-radius:4px;cursor:pointer;color:#b9bbbe;font-size:14px;transition:all .15s}
.channel-item:hover{background:#2f3136;color:#dcddde}
.channel-item.active{background:rgba(79,84,92,.6);color:#fff}
.channel-item .ch-icon{margin-right:8px;font-size:16px}
.channel-item.sub-item{padding-left:32px;font-size:13px}

/* 用户区域 */
.user-panel{height:52px;background:#232428;display:flex;align-items:center;padding:0 8px;gap:8px}
.user-panel .avatar{width:32px;height:32px;font-size:12px}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-status{font-size:11px;color:#b9bbbe}

/* 主内容区 */
.main-area{flex:1;display:flex;flex-direction:column;background:#313338;min-width:0}
.chat-header{height:48px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #3f4147;font-weight:600}
.chat-header .ch-hash{color:#6d6f78;font-size:24px}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.message{_display:flex;gap:16px;padding:4px 16px;border-radius:4px}
.message:hover{background:rgba(0,0,0,.1)}
.message .msg-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:#fff}
.message-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg-author{font-weight:600;color:#fff;font-size:14px}
.msg-time{font-size:10px;color:#72767d}
.msg-content{font-size:14px;color:#dbdee1;line-height:1.4}

/* 聊天输入区 */
.chat-input-area{padding:0 16px 24px;display:flex;gap:8px}
.chat-input{flex:1;background:#404045;border:1px solid #202225;border-radius:8px;padding:10px 14px;color:#dcddde;font-size:14px;resize:none;min-height:44px;max-height:200px}
.chat-input:focus{outline:none;border-color:#5865f2}
.chat-input::placeholder{color:#72767d}

/* 右侧面板 (成员列表) */
.right-panel{width:260px;background:#2b2d31;border-left:1px solid #202225;display:flex;flex-direction:column;overflow:hidden}
.right-panel-header{height:36px;padding:0 16px;display:flex;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;color:#939ba2}
.members-list{flex:1;overflow-y:auto;padding:8px}
.member-item{display:flex;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;color:#b9bbbe;font-size:13px;gap:8px}
.member-item:hover{background:rgba(79,84,92,.4);color:#dcddde}
.member-item .avatar{width:24px;height:24px;font-size:10px}
.member-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-badge{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.badge-owner{background:#f04747;color:#fff}
.badge-admin{background:#f04747;color:#fff}
.badge-mod{background:#43b581;color:#fff}

/* 交易大厅 */
.trading-selector{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#2b2d31;border-bottom:1px solid #202225}
.exchange-select{background:#383842;border:1px solid #202225;border-radius:4px;padding:6px 12px;color:#dcddde;font-size:13px;cursor:pointer;min-width:140px}
.exchange-select:focus{outline:none;border-color:#5865f2}
.symbol-input{background:#383842;border:1px solid #202225;border-radius:4px;padding:6px 12px;color:#dcddde;font-size:13px;width:100px}
.symbol-input:focus{outline:none;border-color:#5865f2}

/* K线图表容器 */
.kline-container{flex:1;padding:16px;min-height:400px}
.kline-controls{display:flex;gap:8px;margin-bottom:12px}
.kline-btn{padding:4px 12px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;background:#383842;color:#b9bbbe;border:1px solid #202225;transition:all .15s}
.kline-btn:hover{background:#404045;color:#fff}
.kline-btn.active{background:#5865f2;color:#fff;border-color:#5865f2}
.kline-chart{height:350px;border-radius:8px;overflow:hidden}

/* 行情面板 */
.quote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px}
.quote-card{background:#36393f;border-radius:8px;padding:16px;transition:all .25s;cursor:pointer;border:1px solid transparent}
.quote-card:hover{background:#404045;transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3);border-color:rgba(88,101,242,.3)}
.home-nav-card{background:#36393f;border-radius:8px;padding:20px;transition:all .25s;cursor:pointer;border:1px solid rgba(79,84,92,.2)}
.home-nav-card:hover{background:#404045;transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.4);border-color:rgba(88,101,242,.4)}
.quote-symbol{font-weight:600;font-size:16px;color:#fff}
.quote-price{font-size:24px;font-weight:700;margin:4px 0}
.quote-change{font-size:13px;font-weight:500}

/* 模态框样式覆盖 */
.modal h3{color:#fff;font-size:18px;font-weight:600}
.modal input,.modal select,.modal textarea{background:#404045;border-color:#202225;color:#dcddde}
.modal input:focus,.modal textarea:focus{border-color:#5865f2}
</style>
</head>
<body>

<!-- 整体容器 (Discord风格) -->
<div id="app-container" class="discord-container">

    <div class="guilds-bar" id="guilds-bar">

<!-- MODAL -->
<div id="modal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal fade-in" id="modal-body"></div>
</div>
<!-- TOASTS -->
<div class="toast-wrap" id="toasts"></div>

<script>
// 优先从 localStorage 读取，其次从 sessionStorage 读取
const savedToken = localStorage.getItem('qt_token') || sessionStorage.getItem('qt_token') || '';
const savedUser = JSON.parse(localStorage.getItem('qt_user') || sessionStorage.getItem('qt_user') || 'null');
const S={token:savedToken,user:savedUser,page:'home',ws:null,channelId:null,guildId:null};
const A='/api';

// ===== UTILS =====
let isLoggingOut = false;  // 防止401触发无限循环
async function api(p,o={}){
const h={...(o.headers||{})};
if(!h['Content-Type'] && !(o.body instanceof FormData)){
h['Content-Type']='application/json';
}
if(o.body instanceof FormData && !h['Content-Type']){
delete h['Content-Type'];
}
if(S.token)h.Authorization='Bearer '+S.token;
const r=await fetch(A+p,{...o,headers:h});
if(r.status===401&&!p.includes('/auth/')&&!isLoggingOut){
isLoggingOut=true;
doLogout();
isLoggingOut=false;
return null;
}
return r.json();
}
function toast(msg,type='info'){const c={info:'#5865f2',success:'#23a559',error:'#ed4245'};const d=document.createElement('div');d.className='toast';d.style.background=c[type]||c.info;d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ===== NAV =====
function nav(id){
S.page=id;
renderPage();
}

// ===== PAGE ROUTER =====
function renderPage(){
const content=document.getElementById('main-content');
const title=document.getElementById('main-header-title');
document.getElementById('right-panel').style.display='none';

switch(S.page){
case 'home':title.textContent='🏠 首页';renderHome();break;
case 'trading':title.textContent='📊 交易大厅';renderTradingFloor();break;
case 'market':title.textContent='📈 行情';renderMarket();break;
case 'crypto':title.textContent='🪙 加密货币';renderCrypto();break;
case 'forex':title.textContent='💱 外汇贵金属';renderForex();break;
case 'kline':title.textContent='📊 K线分析';renderKline();break;
case 'chat':title.textContent='💬 聊天室';renderChat();break;
case 'friends':title.textContent='👥 好友';renderFriends();break;
case 'messages':title.textContent='💬 私信';renderMessages();break;
case 'groups':title.textContent='👥 群聊';renderGroups();break;
case 'portfolio':title.textContent='📜 成绩单';renderPortfolio();break;
case 'profile':title.textContent='👤 个人主页';renderProfile();break;
case 'wallet':title.textContent='💰 我的钱包';renderWallet();break;
default:title.textContent='🏠 首页';renderHome();
}
}

let S_klineChart=null;
async function loadTradingChart(){
const exchange=document.getElementById('exchange-select').value;
const symbol=document.getElementById('symbol-select').value;
const period=S.klinePeriod||'1h';

const chartEl=document.getElementById('kline-chart');
if(!chartEl)return;

if(S_klineChart){S_klineChart.remove();S_klineChart=null;}
try{
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{type:'solid',color:'#36393f'},textColor:'#b9bbbe'},grid:{vertLines:{color:'#404045'},horzLines:{color:'#404045'}},width:chartEl.clientWidth,height:380});
S_klineChart=chart;

const candleSeries=chart.addCandlestickSeries({upColor:'#23a559',downColor:'#ed4245',borderVisible:false});
const res=await api(`/market/kline/${symbol}?period=${period}&limit=200`);
if(res&&res.length){
candleSeries.setData(res.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
chart.timeScale().fitContent();
}else{
const now=Math.floor(Date.now()/1000);
const data=generateMockKline(symbol,now,200);
candleSeries.setData(data);
chart.timeScale().fitContent();
}

// 更新价格
const last=res?.[res.length-1];
if(last){
document.getElementById('current-price').textContent=last.close?.toFixed(5)||'--';
const change=last.close-last.open;
const pct=((change/last.open)*100).toFixed(2);
document.getElementById('price-change').innerHTML=`<span class="${change>=0?'gain':'loss'}">${change>=0?'+':''}${change.toFixed(5)} (${pct}%)</span>`;
}
}catch(e){
console.error('K线加载失败:',e);
}
}

function generateMockKline(symbol,now,count){
const data=[];
let price=symbol.includes('BTC')?45000:symbol.includes('XAU')?2000:1.1;
for(let i=count;i>=0;i--){
const t=now-i*3600;
const o=price;
price*=(1+(Math.random()-0.5)*0.01);
const h=Math.max(o,price)*(1+Math.random()*0.002);
const l=Math.min(o,price)*(1-Math.random()*0.002);
const c=price;
data.push({time:t,open:o,high:h,low:l,close:c});
}
return data;
}

let ExchangeModule = {
    regions: [],
    configs: [],
    selectedRegion: null,
    
    async init() {
        try {
            await this.loadRegions();
        } catch (e) {
            console.error('loadRegions error:', e);
        }
        try {
            await this.loadConfigs();
        } catch (e) {
            console.error('loadConfigs error:', e);
            // 如果未登录，configs 为空数组
            this.configs = [];
        }
        this.render();
    },
    
    async loadRegions() {
        const res = await api('/exchanges/regions');
        if (res) this.regions = res;
    },
    
    async loadConfigs() {
        try {
            const res = await api('/exchanges/');
            if (res) this.configs = res;
        } catch (e) {
            // 未登录或出错时configs为空
            this.configs = [];
        }
    },
    
    render() {
        const el = document.getElementById('crypto-list');
        if (!el) return;
        
        const configured = new Set(this.configs.map(c => c.exchange));
        
        el.innerHTML = `
        <div style="margin-bottom:24px">
            <h3 style="color:#fff;font-size:16px;margin-bottom:12px">已绑定的交易所</h3>
            <div id="exchange-list">
                ${this.configs.length === 0 ? '<p style="color:#b9bbbe">尚未绑定任何交易所</p>' : ''}
                ${this.configs.map(c => this.renderConfigCard(c)).join('')}
            </div>
        </div>
        
        <div style="margin-bottom:24px">
            <h3 style="color:#fff;font-size:16px;margin-bottom:12px">添加交易所</h3>
            
            <div style="margin-bottom:16px">
                <label style="display:block;color:#b9bbbe;font-size:13px;margin-bottom:8px">选择地区</label>
                <div style="display:flex;flex-wrap:wrap;gap:8px" id="region-buttons">
                    ${this.regions.map(r => `
                        <button onclick="ExchangeModule.selectRegion('${r.region}')" 
                            class="tag ${this.selectedRegion === r.region ? 'tag-active' : ''}" 
                            id="region-${r.region}">
                            ${r.region_name}
                        </button>
                    `).join('')}
                </div>
            </div>
            
            ${this.selectedRegion ? this.renderExchangeSelector() : '<p style="color:#b9bbbe;margin:16px 0">请先选择地区</p>'}
        </div>
        `;
    },
    
    renderConfigCard(config) {
        const region = this.regions.find(r => r.exchanges?.some(e => e.id === config.exchange));
        const exchange = region?.exchanges?.find(e => e.id === config.exchange);
        const name = exchange?.name || config.exchange;
        const icon = exchange?.icon || '💰';
        const verified = config.is_verified;
        
        return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:#2d2d32;border-radius:8px;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:12px">
                <span style="font-size:28px">${icon}</span>
                <div>
                    <div style="font-weight:600;color:#fff">${name}</div>
                    <div style="font-size:12px;color:#b9bbbe">${config.api_key_masked}</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
                ${verified ? '<span style="color:#23a559;font-size:12px">✓ 已验证</span>' : '<span style="color:#f87171;font-size:12px">未验证</span>'}
                <button onclick="ExchangeModule.deleteExchange(${config.id})" class="btn btn-danger" style="padding:4px 8px;font-size:12px">删除</button>
            </div>
        </div>`;
    },
    
    selectRegion(region) {
        this.selectedRegion = region;
        this.render();
    },
    
    renderExchangeSelector() {
        const region = this.regions.find(r => r.region === this.selectedRegion);
        if (!region) return '';
        
        const configured = new Set(this.configs.map(c => c.exchange));
        const available = region.exchanges.filter(e => !configured.has(e.id));
        
        if (available.length === 0) {
            return '<p style="color:#b9bbbe;margin:16px 0">该地区交易所已全部绑定</p>';
        }
        
        return `
        <div style="background:#2d2d32;border-radius:8px;padding:16px">
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px">
                ${available.map(e => `
                    <div onclick="ExchangeModule.showAddForm('${e.id}')" 
                         style="padding:12px;background:#383842;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:all 0.2s"
                         onmouseover="this.style.borderColor='#7289da'"
                         onmouseout="this.style.borderColor='transparent'">
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="font-size:24px">${e.icon}</span>
                            <span style="font-weight:600;color:#fff">${e.name}</span>
                        </div>
                        ${e.need_passphrase ? '<div style="font-size:11px;color:#b9bbbe;margin-top:4px">需要Passphrase</div>' : ''}
                    </div>
                `).join('')}
            </div>
            
            <div id="add-form-container"></div>
        </div>`;
    },
    
    showAddForm(exchangeId) {
        const region = this.regions.find(r => r.region === this.selectedRegion);
        const exchange = region?.exchanges?.find(e => e.id === exchangeId);
        if (!exchange) return;
        
        const container = document.getElementById('add-form-container');
        container.innerHTML = `
        <form onsubmit="ExchangeModule.addExchange(event, '${exchangeId}')">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
                <span style="font-size:20px">${exchange.icon}</span>
                <span style="font-weight:600;color:#fff">${exchange.name}</span>
            </div>
            <input id="api-key-input" class="input" placeholder="API Key" required style="margin-bottom:8px">
            <input id="api-secret-input" class="input" type="password" placeholder="API Secret" required style="margin-bottom:8px">
            ${exchange.need_passphrase ? '<input id="passphrase-input" class="input" placeholder="Passphrase" style="margin-bottom:8px">' : ''}
            <div style="display:flex;gap:8px;margin-top:8px">
                <button type="submit" class="btn btn-primary" style="flex:1">绑定</button>
                <button type="button" onclick="document.getElementById('add-form-container').innerHTML=''" class="btn btn-ghost">取消</button>
            </div>
            <p style="font-size:11px;color:#b9bbbe;margin-top:8px">
                <a href="${exchange.docs_url}" target="_blank" style="color:#7289da">如何获取API Key?</a>
            </p>
        </form>`;
    },
    
    async addExchange(e, exchangeId) {
        e.preventDefault();
        const form = e.target;
        const apiKey = form.querySelector('#api-key-input').value;
        const apiSecret = form.querySelector('#api-secret-input').value;
        const passphrase = form.querySelector('#passphrase-input')?.value;
        
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = '绑定中...';
        btn.disabled = true;
        
        try {
            const res = await api('/exchanges/', {
                method: 'POST',
                body: JSON.stringify({
                    exchange: exchangeId,
                    api_key: apiKey,
                    api_secret: apiSecret,
                    passphrase: passphrase || null
                })
            });
            
            if (res?.id) {
                toast(`${res.exchange} 绑定成功！`, 'success');
                await this.loadConfigs();
            } else {
                toast(res?.detail || '绑定失败', 'error');
            }
        } catch (err) {
            toast('绑定失败: ' + err.message, 'error');
        }
        
        btn.textContent = '绑定';
        btn.disabled = false;
    },
    
    async deleteExchange(id) {
        if (!confirm('确定要删除这个交易所绑定吗？')) return;
        
        try {
            const res = await api(`/exchanges/${id}`, { method: 'DELETE' });
            toast('已删除', 'success');
            await this.loadConfigs();
        } catch (err) {
            toast('删除失败', 'error');
        }
    }
};

// 生成模拟K线数据
function generateMockKline(symbol,period){
const data=[];
let basePrice=100;
if(symbol.includes('BTC'))basePrice=67000;
else if(symbol.includes('ETH'))basePrice=3500;
else if(symbol.includes('XAU')||symbol==='Gold')basePrice=2350;
else if(symbol.includes('EUR'))basePrice=1.08;
else if(symbol.includes('GBP'))basePrice=1.27;
else if(symbol.includes('JPY'))basePrice=155;
const intervals={'1m':1,'5m':5,'15m':15,'1h':60,'4h':240,'1d':1440,'1w':10080};
const min=intervals[period]||60;
const now=Math.floor(Date.now()/1000);
for(let i=200;i>=0;i--){
const t=now-i*min*60;
const o=basePrice*(1+(Math.random()-0.5)*0.02);
const c=basePrice*(1+(Math.random()-0.5)*0.02);
const h=Math.max(o,c)*(1+Math.random()*0.005);
const l=Math.min(o,c)*(1-Math.random()*0.005);
const v=Math.random()*1000000;
data.push({time:t,open:o,high:h,low:l,close:c,volume:v});
basePrice=(o+c)/2;
}
return data;
}

// 渲染K线图
let klineChart=null;
let klineSeries=null;
function renderKlineChart(container,data,period){
container.innerHTML='<div id="kline-inner" style="height:100%"></div>';
const inner=document.getElementById('kline-inner');
if(!inner)return;
try{
if(klineChart){klineChart.remove();klineChart=null;}
klineChart=LightweightCharts.createChart(inner,{width:inner.clientWidth,height:inner.clientHeight,layout:{background:{type:'solid',color:'#36393f'},textColor:'#b9bbbe'},grid:{vertLines:{color:'rgba(79,84,92,0.3)'},horzLines:{color:'rgba(79,84,92,0.3)'}}});
klineSeries=klineChart.addCandlestickSeries({upColor:'#23a559',downColor:'#ed4245',borderUpColor:'#23a559',borderDownColor:'#ed4245',wickUpColor:'#23a559',wickDownColor:'#ed4245'});
klineSeries.setData(data.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
klineChart.timeScale().fitContent();
const resizeObserver=new ResizeObserver(()=>{if(klineChart&&inner)klineChart.resize(inner.clientWidth,inner.clientHeight);});
resizeObserver.observe(inner);
}catch(e){console.error('K线图渲染失败:',e);}
}

// 更新价格显示
function updatePriceDisplay(symbol){
const price=document.getElementById('current-price');
const change=document.getElementById('price-change');
const high=document.getElementById('price-high');
const low=document.getElementById('price-low');
const vol=document.getElementById('price-vol');
if(!price)return;

let basePrice=100,changePct=(Math.random()-0.5)*10;
if(symbol.includes('BTC')){basePrice=67000+(Math.random()-0.5)*500;}
else if(symbol.includes('ETH')){basePrice=3500+(Math.random()-0.5)*50;}
else if(symbol.includes('XAU')||symbol==='Gold'){basePrice=2350+(Math.random()-0.5)*30;}
else if(symbol.includes('EUR')){basePrice=1.08+(Math.random()-0.5)*0.01;changePct=(Math.random()-0.5)*0.5;}
const fmt=symbol.includes('EUR')||symbol.includes('GBP')||symbol.includes('JPY')?4:2;
price.textContent=basePrice.toFixed(fmt);
change.textContent=(changePct>=0?'+':'')+changePct.toFixed(2)+'%';

if(low)low.textContent=(basePrice*0.98).toFixed(fmt);
if(vol)vol.textContent=(Math.random()*1000).toFixed(2)+'M';
// 更新列表中的价格
document.querySelectorAll('.quote-row').forEach(row=>{
const sym=row.dataset.symbol;
if(sym===symbol){
row.querySelector('.quote-price').textContent=basePrice.toFixed(fmt);
const c=row.querySelector('.quote-change');
c.textContent=(changePct>=0?'+':'')+changePct.toFixed(2)+'%';

});
}

// 私信WebSocket连接
let dmWs = null;
let dmTypingTimeout = null;

function connectDmWebSocket() {
    if (!S.user || dmWs) return;
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const host = location.host;
    const token = localStorage.getItem('token') || '';
    
    dmWs = new WebSocket(`${protocol}//${host}/api/ws/private?token=${encodeURIComponent(token)}`);
    
    dmWs.onopen = () => {
        console.log('DM WebSocket connected');
        // 定期发送心跳
        setInterval(() => {
            if (dmWs && dmWs.readyState === WebSocket.OPEN) {
                dmWs.send(JSON.stringify({type: 'heartbeat'}));
            }
        }, 30000);
    };
    
    dmWs.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleDmMessage(data);
    };
    
    dmWs.onclose = () => {
        console.log('DM WebSocket disconnected');
        dmWs = null;
        // 5秒后重连
        setTimeout(connectDmWebSocket, 5000);
    };
    
    dmWs.onerror = (err) => {
        console.error('DM WebSocket error:', err);
    };
}

function handleDmMessage(data) {
    if (data.type === 'new_message') {
        // 收到新私信
        const isCurrentChat = S.currentDmUser === data.sender_id;
        
        // 更新未读数
        updateUnreadBadge();
        
        if (isCurrentChat) {
            // 当前聊天中，追加消息
            appendDmMessage(data);
            // 标记已读
            dmWs?.send(JSON.stringify({type: 'read', sender_id: data.sender_id, message_id: data.id}));
        } else {
            // 通知有新消息
            toast(`${data.sender_username} 给你发了一条私信`, 'info');
            // 刷新对话列表
            loadConversations();
        }
    } else if (data.type === 'typing') {
        // 显示对方正在输入
        showTypingIndicator(data.from_username);
    } else if (data.type === 'message_read') {
        // 消息已读
        markMessageAsRead(data.message_id);
    }
}

function appendDmMessage(m) {
    const el = document.getElementById('dm-messages');
    if (!el) return;
    
    const isMe = m.sender_id === S.user.id;
    const html = renderDmMessage(m, isMe);
    el.innerHTML += html;
    el.scrollTop = el.scrollHeight;
}

function renderDmMessage(m, isMe) {
    const senderName = isMe ? '你' : (m.sender_username || '未知');
    const time = new Date(m.created_at).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    const avatarColor = isMe ? '#5865f2' : '#f04747';
    const avatarLetter = (isMe ? S.user.username : senderName)[0].toUpperCase();
    
    let contentHtml = '';
    if (m.msg_type === 'image' && m.media_url) {
        contentHtml = `<img src="${m.media_url}" style="max-width:300px;border-radius:8px;cursor:pointer" onclick="window.open('${m.media_url}')">`;
    } else if (m.msg_type === 'file' && m.media_url) {
        contentHtml = `<a href="${m.media_url}" target="_blank" style="display:flex;align-items:center;gap:8px;padding:8px;background:#404045;border-radius:4px;text-decoration:none;color:#38bdf8">
            <span style="font-size:20px">📎</span>
            <span style="flex:1">${esc(m.content)}</span>
        </a>`;
    } else if (m.msg_type === 'chart' && m.media_url) {
        contentHtml = `<div style="background:#2b2d31;border-radius:8px;padding:8px">
            <div style="font-size:12px;color:#72767d;margin-bottom:4px">📊 行情截图</div>
            <img src="${m.media_url}" style="max-width:280px;border-radius:4px;cursor:pointer" onclick="window.open('${m.media_url}')">
        </div>`;
    } else {
        contentHtml = `<div class="msg-content">${parseMessageContent(m.content)}</div>`;
    }
    
    const readStatus = isMe ? (m.is_read ? '<span style="color:#23a559;font-size:10px">已读</span>' : '<span style="color:#72767d;font-size:10px">未读</span>') : '';
    
    return `<div class="message" style="margin-bottom:12px">
        <div class="msg-avatar" style="background:${avatarColor}">${avatarLetter}</div>
        <div style="flex:1">
            <div class="message-header">
                <span class="msg-author">${senderName}</span>
                <span class="msg-time">${time}</span>
                ${readStatus}
            </div>
            ${contentHtml}
        </div>
    </div>`;
}

function parseMessageContent(content) {
    // 支持表情包格式 :emoji:
    return esc(content);
}

function formatRelativeTime(timeStr) {
    if (!timeStr) return '';
    const date = new Date(timeStr);
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return `${minutes}m`;
    if (hours < 24) return `${hours}h`;
    if (days < 7) return `${days}d`;
    return date.toLocaleDateString('zh-CN', {month: 'short', day: 'numeric'});
}

async function loadDmHistory(userId) {
    try {
        const res = await api('/messages/' + userId);
        const el = document.getElementById('dm-messages');
        if (res && res.length) {
            el.innerHTML = res.map(m => renderDmMessage(m, m.sender_id === S.user.id)).join('');
            el.scrollTop = el.scrollHeight;
        } else {
            el.innerHTML = '<div style="text-align:center;color:#72767d;padding:40px"><div style="font-size:32px;margin-bottom:8px">💬</div><div>开始和 ${S.currentDmUsername} 聊天吧</div></div>';
        }
    } catch (e) {
        console.error('Load history error:', e);
        document.getElementById('dm-messages').innerHTML = '<p style="text-align:center;color:#f04747">加载失败</p>';
    }
}

async function sendDm() {
    const input = document.getElementById('dm-input');
    const msg = input.value.trim();
    if (!msg || !S.currentDmUser) return;
    
    try {
        await api('/messages/', {
            method: 'POST',
            body: JSON.stringify({
                receiver_id: S.currentDmUser,
                content: msg,
                msg_type: 'text'
            })
        });
        input.value = '';
        loadDmHistory(S.currentDmUser);
    } catch (e) {
        toast('发送失败', 'error');
    }
}

function handleDmKeydown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendDm();
    }
}

function sendTypingIndicator() {
    if (dmWs && dmWs.readyState === WebSocket.OPEN && S.currentDmUser) {
        dmWs.send(JSON.stringify({
            type: 'typing',
            receiver_id: S.currentDmUser
        }));
    }
}

function filterConversations() {
    const search = document.getElementById('msg-search').value.toLowerCase();
    document.querySelectorAll('#conversations-list .channel-item').forEach(c => {
        c.style.display = c.textContent.toLowerCase().includes(search) ? 'flex' : 'none';
    });
}

function toggleEmojiPicker() {
    // 简单表情选择器
    const emojis = ['😀', '😂', '🥰', '😍', '🤔', '👍', '👎', '🎉', '🔥', '💯', '📈', '📉', '💰', '💎', '🚀', '⚡'];
    const input = document.getElementById('dm-input');
    const picker = document.createElement('div');
    picker.style.cssText = 'position:absolute;bottom:80px;left:16px;background:#36393f;border:1px solid #202225;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;z-index:100';
    picker.innerHTML = emojis.map(e => `<button onclick="insertEmoji('${e}')" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px">${e}</button>`).join('');
    picker.id = 'emoji-picker';
    
    // 移除已存在的picker
    document.querySelectorAll('#emoji-picker').forEach(p => p.remove());
    
    document.querySelector('.chat-input-area').style.position = 'relative';
    document.querySelector('.chat-input-area').appendChild(picker);
    
    // 点击其他地方关闭
    setTimeout(() => {
        document.addEventListener('click', function closePicker(e) {
            if (!picker.contains(e.target) && e.target.id !== 'dm-input') {
                picker.remove();
                document.removeEventListener('click', closePicker);
            }
        });
    }, 100);
}

function insertEmoji(emoji) {
    const input = document.getElementById('dm-input');
    input.value += emoji;
    input.focus();
    document.getElementById('emoji-picker')?.remove();
}

function attachImage() {
    document.getElementById('dm-image-input').click();
}

async function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file || !S.currentDmUser) return;
    
    // 上传图片
    const formData = new FormData();
    formData.append('file', file);
    
    try {
        const res = await fetch('/api/upload/', {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('token')},
            body: formData
        }).then(r => r.json());
        
        if (res.url) {
            await api('/messages/', {
                method: 'POST',
                body: JSON.stringify({
                    receiver_id: S.currentDmUser,
                    content: '[图片]',
                    msg_type: 'image',
                    media_url: res.url
                })
            });
            loadDmHistory(S.currentDmUser);
        } else {
            toast('上传失败', 'error');
        }
    } catch (e) {
        toast('上传失败', 'error');
    }
    
    event.target.value = '';
}

async function attachChart() {
    // 生成当前行情截图
    const chartEl = document.querySelector('.kline-container canvas') || document.querySelector('.kline-chart');
    if (chartEl) {
        try {
            const canvas = await html2canvas(chartEl);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            const formData = new FormData();
            formData.append('file', blob, 'chart.png');
            
            const res = await fetch('/api/upload/', {
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + localStorage.getItem('token')},
                body: formData
            }).then(r => r.json());
            
            if (res.url) {
                await api('/messages/', {
                    method: 'POST',
                    body: JSON.stringify({
                        receiver_id: S.currentDmUser,
                        content: '[行情截图]',
                        msg_type: 'chart',
                        media_url: res.url
                    })
                });
                loadDmHistory(S.currentDmUser);
            }
        } catch (e) {
            toast('截图发送失败', 'error');
        }
    } else {
        toast('请先打开行情页面', 'info');
    }
}

function openCallWindow(roomId, type, username) {

}

};

async function addReport(e){
e.preventDefault();

const data={
name:fd.get('name'),
strategy_name:fd.get('strategy_name'),
symbol:fd.get('symbol'),
period:'1h',

end_date:new Date().toISOString().split('T')[0],
total_trades:parseInt(fd.get('total_trades')),
win_rate:parseFloat(fd.get('win_rate')),

max_drawdown:parseFloat(fd.get('max_drawdown')),
total_return:parseFloat(fd.get('total_return')),
is_public:fd.get('is_public')==='on'
};
const res=await api('/portfolio/reports',{method:'POST',body:JSON.stringify(data)});
if(res?.id){closeModal();toast('回测报告已发布！','success');renderPortfolio();}
else{toast(res?.detail||'发布失败','error');}
}
