<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTalk - 量化交易平台</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        html, body{
            background:#121212;
            color:#fff;
            width:100%;
            height:100%;
            overflow:hidden;
            position:fixed;
            top:0;
            left:0;
        }

        /* 左侧边栏 */
        .sidebar{
            position:absolute;
            left:0;
            top:0;
            width:260px;
            height:100%;
            background:#1e1e1e;
            border-right:1px solid #333;
            overflow-y:auto;
            z-index:10;
        }
        .logo{text-align:center;font-size:20px;color:#00ff88;font-weight:bold;margin:20px 0;}
        
        .menu-item{padding:12px 25px;color:#fff;cursor:pointer;font-size:15px;transition:.2s;}
        .menu-item.active{background:#2b291b;color:#ffcc00;}
        
        .submenu{display:none;padding-left:20px;}
        .submenu.show{display:block;}
        .submenu-item{
            padding:8px 25px;
            margin:2px 0;
            border-radius:4px;
            font-size:14px;
            color:#cccccc;
            cursor:pointer;
            transition:.2s;
        }
        .submenu-item:hover{background:#2a2a2a;color:#ffffff;}
        .submenu-item.active{color:#00ff88;font-weight:500;}

        /* 主内容区 */
        .content{
            position:absolute;
            left:260px;
            top:0;
            right:0;
            bottom:0;
            padding:30px;
            overflow-y:auto;
            background:#121212;
        }
        .page-title{font-size:22px;color:#00ff88;margin-bottom:20px;}
        
        .card{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:20px;margin-bottom:20px;}
        .tv-container{width:100%;height:480px;border-radius:8px;background:#1e1e1e;margin-bottom:20px;}
        
        input, select, textarea, button{
            width:100%;padding:10px 12px;border-radius:4px;
            border:1px solid #444;background:#252525;color:#fff;
            outline:none;margin-bottom:12px;
        }
        button{background:#00ff88;color:#111;font-weight:bold;cursor:pointer;border:none;}
        button:hover{opacity:.9;}

        .form-label{margin-bottom:6px;display:block;color:#eee;}
        .tip{color:#888;font-size:12px;margin-top:4px;}
        
        .chat-box{height:400px;border:1px solid #333;border-radius:8px;padding:15px;background:#1a1a1a;margin-bottom:15px;overflow-y:auto;}
        .post-card{border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px;background:#1b1b1b;}
        .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
        .voice-controls{display:flex;gap:10px;margin-top:10px;}
        .voice-btn{flex:1;padding:8px;background:#252525;border:none;color:#fff;border-radius:4px;cursor:pointer;}
        .voice-btn.active{background:#00ff88;color:#111;}

        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;}
        .modal-box{background:#1e1e1e;padding:30px;border-radius:8px;width:400px;}
        .tab-btn{width:50%;background:#252525;border:none;color:#fff;padding:10px;cursor:pointer;}
        .tab-btn.active{background:#00ff88;color:#111;}
    </style>
    <!-- 引入 i18next -->
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.10.1/dist/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@2.5.1/dist/i18nextHttpBackend.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@7.2.1/dist/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-box">
        <div style="display:flex;margin-bottom:20px;">
            <button class="tab-btn active" onclick="switchTab('login')" data-i18n="txt_login">登录</button>
            <button class="tab-btn" onclick="switchTab('register')" data-i18n="txt_reg">注册</button>
        </div>
        <div id="loginForm">
            <label class="form-label" data-i18n="txt_acc">用户名/邮箱</label>
            <input placeholder="" data-i18n-placeholder="txt_acc_plh">
            <label class="form-label" data-i18n="txt_pwd">密码</label>
            <input type="password" placeholder="" data-i18n-placeholder="txt_pwd_plh">
            <button onclick="handleLogin()" data-i18n="txt_login_btn">登录</button>
            <p class="tip" style="text-align:center;margin-top:10px;">或</p>
            <button style="background:#3b82f6;" onclick="alert(i18n.t('web3_login'))" data-i18n="txt_web3">Web3 钱包登录</button>
        </div>
        <div id="registerForm" style="display:none;">
            <label class="form-label" data-i18n="txt_uname">用户名</label>
            <input placeholder="" data-i18n-placeholder="txt_uname_plh">
            <label class="form-label" data-i18n="txt_email">邮箱</label>
            <input placeholder="" data-i18n-placeholder="txt_email_plh">
            <label class="form-label" data-i18n="txt_pwd">密码</label>
            <input type="password" placeholder="" data-i18n-placeholder="txt_pwd_plh">
            <button onclick="handleRegister()" data-i18n="txt_reg_btn">注册</button>

    </div>
</div>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="logo">QuantTalk</div>

    <div class="menu-item active" onclick="toggleSub(1)" data-i18n="m1">交易市场</div>

        <div class="submenu-item" onclick="renderPage('kline-pro', this)" data-i18n="m1_5">专业K线分析</div>
    </div>

    <div class="menu-item" onclick="toggleSub(2)" data-i18n="m2">交易社区</div>
    <div class="submenu" id="sub2">
        <div class="submenu-item" onclick="renderPage('dynamic-square', this)" data-i18n="m2_1">综合动态广场</div>
        <div class="submenu-item" onclick="renderPage('strategy-square', this)" data-i18n="m2_2">量化策略广场</div>
        <div class="submenu-item" onclick="renderPage('backtest-center', this)" data-i18n="m2_3">回测中心</div>

        <div class="submenu-item" onclick="renderPage('copy-trade', this)" data-i18n="m2_5">一键跟单</div>
        <div class="submenu-item" onclick="renderPage('trade-live', this)" data-i18n="m2_6">交易直播</div>
    </div>

    <div class="menu-item" onclick="toggleSub(3)" data-i18n="m3">社区频道</div>
    <div class="submenu" id="sub3">
        <div class="submenu-item" onclick="renderPage('create-channel', this)" data-i18n="m3_1">+ 创建新频道</div>
        <div class="submenu-item" onclick="renderPage('text-channel', this)" data-i18n="m3_2">文字频道</div>
        <div class="submenu-item" onclick="renderPage('voice-channel', this)" data-i18n="m3_3">语音频道</div>
        <div class="submenu-item" onclick="renderPage('video-channel', this)" data-i18n="m3_4">视频/共享频道</div>
        <div class="submenu-item" onclick="renderPage('signal-channel', this)" data-i18n="m3_5">交易信号频道</div>
        <div class="submenu-item" onclick="renderPage('official-channel', this)" data-i18n="m3_6">官方公告频道</div>
    </div>

    <div class="menu-item" onclick="toggleSub(4)" data-i18n="m4">社交消息</div>
    <div class="submenu" id="sub4">
        <div class="submenu-item" onclick="renderPage('private-chat', this)" data-i18n="m4_1">私信聊天</div>
        <div class="submenu-item" onclick="renderPage('friend-list', this)" data-i18n="m4_2">好友列表</div>
        <div class="submenu-item" onclick="renderPage('private-group', this)" data-i18n="m4_3">私密群组</div>
    </div>

    <div class="menu-item" onclick="toggleSub(5)" data-i18n="m5">个人中心</div>
    <div class="submenu" id="sub5">
        <div class="submenu-item" onclick="renderPage('user-info', this)" data-i18n="m5_1">个人资料</div>
        <div class="submenu-item" onclick="renderPage('lang-setting', this)" data-i18n="m5_2">语言设置</div>

        <div class="submenu-item" onclick="renderPage('wallet-manage', this)" data-i18n="m5_4">钱包管理</div>
        <div class="submenu-item" onclick="renderPage('bot-manage', this)" data-i18n="m5_5">量化Bot管理</div>
    </div>
</div>

<div class="content" id="mainContent"></div>

// 更新所有带 data-i18n 属性的元素
function updateContent(){
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        let k = el.getAttribute('data-i18n');
        el.innerText = i18n.t(k);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
        let k = el.getAttribute('data-i18n-placeholder');
        el.placeholder = i18n.t(k);
    });
}

// 切换语言
function setLang(lang){
    i18n.changeLanguage(lang, () => {
        updateContent();
        renderPage(currPage, currActiveEl);
    });
}

// ========== 全局变量 ==========
let currPage = "trade-hall";
let currActiveEl = null;

// 菜单折叠
function toggleSub(num){
    document.querySelectorAll('.submenu').forEach(el=>el.classList.remove('show'));
    document.getElementById('sub'+num).classList.add('show');
    document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.menu-item')[num-1].classList.add('active');
}

// 页面渲染（所有标题和文案都用 i18n.t 包裹）

    // 社交消息
    if(pageName==="private-chat"){
        html=`<div class="page-title">${i18n.t('m4_1')}</div><div class="chat-box">聊天消息记录</div><input placeholder="输入消息…"><button>发送</button></div>`;
    }
    if(pageName==="friend-list"){
        html=`<div class="page-title">${i18n.t('m4_2')}</div><div class="card"><p>${i18n.t('friend_online')}</p><p>${i18n.t('friend_offline')}</p></div>`;
    }
    if(pageName==="private-group"){
        html=`<div class="page-title">${i18n.t('m4_3')}</div><div class="card"><p>群组聊天窗口</p></div>`;
    }

    // 个人中心
    if(pageName==="user-info"){
        html=`<div class="page-title">${i18n.t('m5_1')}</div><div class="card">
        <label>${i18n.t('nickname')}</label><input placeholder="${i18n.t('nickname_plh')}">
        <label>${i18n.t('bio')}</label><textarea rows="3" placeholder="${i18n.t('bio_plh')}"></textarea>
        <button>${i18n.t('save')}</button></div>`;
    }
    if(pageName==="lang-setting"){
        html=`<div class="page-title">${i18n.t('lang_title')}</div><div class="card">
        <label class="form-label">${i18n.t('lang_select')}</label>
        <select id="langSelect" onchange="setLang(this.value)">
            <option value="zh-CN" ${i18n.language==='zh-CN'?'selected':''}>中文（简体）</option>
            <option value="en" ${i18n.language==='en'?'selected':''}>English</option>
            <option value="ko" ${i18n.language==='ko'?'selected':''}>한국어</option>
        </select>
        <p class="tip">${i18n.t('lang_tip')}</p>
        <button onclick="alert(i18n.t('save')+' OK')">${i18n.t('save')}</button></div>`;
    }
    if(pageName==="exchange-api"){
        html=`<div class="page-title">${i18n.t('m5_3')}</div><div class="card">
        <label>${i18n.t('exchange')}</label><select><option>币安</option><option>OKX</option></select>
        <label>${i18n.t('api_key')}</label><input placeholder="${i18n.t('api_key')}">
        <label>${i18n.t('api_secret')}</label><input placeholder="${i18n.t('api_secret')}">
        <button onclick="alert(i18n.t('api_check_ok'))">保存并校验</button></div>`;
    }
    if(pageName==="wallet-manage"){
        html=`<div class="page-title">${i18n.t('m5_4')}</div><div class="card">
        <label>链类型</label><select><option>ETH</option><option>TRON</option></select>
        <label>钱包地址</label><input placeholder="0x...">
        <button>绑定钱包</button></div>`;
    }
    if(pageName==="bot-manage"){
        html=`<div class="page-title">${i18n.t('m5_5')}</div><div class="card">
        <label>${i18n.t('bot_type')}</label><select><option>网格交易</option><option>马丁策略</option></select>
        <label>${i18n.t('bot_status')}</label><input value="已停止" readonly>
        <button>${i18n.t('bot_start')}</button></div>`;
    }

    document.getElementById("mainContent").innerHTML = html;

    // 渲染完页面后，再执行一次全局语言渲染，把新生成的内容里的 data-i18n 元素也翻译了
    updateContent();

    // 初始化TradingView
    if(pageName==="trade-hall")initTV("tv1","BINANCE:BTCUSDT");
    if(pageName==="crypto-market")initTV("tv2","BINANCE:ETHUSDT");
    if(pageName==="forex-metal")initTV("tv3","FX_IDC:XAUUSD");
    if(pageName==="future-market")initTV("tv4","CME:NQ1!");
    if(pageName==="kline-pro")initTV("tv5","NASDAQ:AAPL");
}

function initTV(id, symbol){
    new TradingView.widget({
        autosize:true,symbol:symbol,interval:"D",timezone:"Asia/Shanghai",
        theme:"dark",style:"1",locale:"zh",container_id:id
    });
}

function copyWebhook(){
    const inp=document.querySelector('input[value*="duckdns"]');
    inp.select();document.execCommand('copy');alert(i18n.t('copy')+" OK");
}

function switchTab(type){
    if(type==='login'){
        document.getElementById('loginForm').style.display='block';
        document.getElementById('registerForm').style.display='none';
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.querySelectorAll('.tab-btn')[1].classList.remove('active');
    }else{
        document.getElementById('loginForm').style.display='none';
        document.getElementById('registerForm').style.display='block';
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.querySelectorAll('.tab-btn')[0].classList.remove('active');
    }
}

// 登录/注册模拟函数
function handleLogin(){
    alert(i18n.t('login_ok'));
    document.getElementById('loginModal').style.display='none';
}
function handleRegister(){
    alert(i18n.t('reg_ok'));
    switchTab('login');
}

// 初始化
window.onload=()=>{
    updateContent();
    renderPage('trade-hall', document.querySelector('.submenu-item.active'));
}
</script>
</body>
</html>
