<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTalk - 量化交易平台</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        html, body{
            background:#121212;
            color:#fff;
            width:100%;
            height:100%;
            overflow:hidden;
            position:fixed;
            top:0;
            left:0;
        }
        .sidebar{
            position:absolute;left:0;top:0;width:260px;height:100%;
            background:#1e1e1e;border-right:1px solid #333;overflow-y:auto;z-index:10;
        }
        .logo{text-align:center;font-size:20px;color:#00ff88;font-weight:bold;margin:20px 0;}
        .menu-item{padding:12px 25px;color:#fff;cursor:pointer;font-size:15px;transition:.2s;}
        .menu-item.active{background:#2b291b;color:#ffcc00;}
        .submenu{display:none;padding-left:20px;}
        .submenu.show{display:block;}
        .submenu-item{
            padding:8px 25px;margin:2px 0;border-radius:4px;font-size:14px;
            color:#cccccc;cursor:pointer;transition:.2;
        }
        .submenu-item:hover{background:#2a2a2a;color:#ffffff;}
        .submenu-item.active{color:#00ff88;font-weight:500;}
        .content{
            position:absolute;left:260px;top:0;right:0;bottom:0;padding:30px;
            overflow-y:auto;background:#121212;
        }
        .page-title{font-size:22px;color:#00ff88;margin-bottom:20px;}
        .card{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:20px;margin-bottom:20px;}
        .tv-container{width:100%;height:480px;border-radius:8px;background:#1e1e1e;margin-bottom:20px;}
        input, select, textarea, button{
            width:100%;padding:10px 12px;border-radius:4px;
            border:1px solid #444;background:#252525;color:#fff;outline:none;margin-bottom:12px;
        }
        button{background:#00ff88;color:#111;font-weight:bold;cursor:pointer;border:none;}
        button:hover{opacity:.9;}
        .form-label{margin-bottom:6px;display:block;color:#eee;}
        .tip{color:#888;font-size:12px;margin-top:4px;}
        .chat-box{height:400px;border:1px solid #333;border-radius:8px;padding:15px;background:#1a1a1a;margin-bottom:15px;overflow-y:auto;}
        .post-card{border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px;background:#1b1b1b;}
        .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
        .voice-controls{display:flex;gap:10px;margin-top:10px;}
        .voice-btn{flex:1;padding:8px;background:#252525;border:none;color:#fff;border-radius:4px;cursor:pointer;}
        .voice-btn.active{background:#00ff88;color:#111;}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;}
        .modal-box{background:#1e1e1e;padding:30px;border-radius:8px;width:400px;}
        .tab-btn{width:50%;background:#252525;border:none;color:#fff;padding:10px;cursor:pointer;}
        .tab-btn.active{background:#00ff88;color:#111;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.10.1/dist/i18next.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<div class="modal-overlay" id="loginModal">
    <div class="modal-box">
        <div style="display:flex;margin-bottom:20px;">
            <button class="tab-btn active" onclick="switchTab('login')" data-i18n="txt_login">登录</button>
            <button class="tab-btn" onclick="switchTab('register')" data-i18n="txt_reg">注册</button>
        </div>
        <div id="loginForm">
            <label class="form-label" data-i18n="txt_acc">用户名/邮箱</label>
            <input data-i18n-placeholder="txt_acc_plh">
            <label class="form-label" data-i18n="txt_pwd">密码</label>
            <input type="password" data-i18n-placeholder="txt_pwd_plh">
            <button onclick="handleLogin()" data-i18n="txt_login_btn">登录</button>
            <p class="tip" style="text-align:center;margin-top:10px;" data-i18n="or">或</p>
            <button style="background:#3b82f6;" onclick="alert(i18n.t('web3_login'))" data-i18n="txt_web3">Web3 钱包登录</button>
        </div>
        <div id="registerForm" style="display:none;">
            <label class="form-label" data-i18n="txt_uname">用户名</label>
            <input data-i18n-placeholder="txt_uname_plh">
            <label class="form-label" data-i18n="txt_email">邮箱</label>
            <input data-i18n-placeholder="txt_email_plh">
            <label class="form-label" data-i18n="txt_pwd">密码</label>
            <input type="password" data-i18n-placeholder="txt_pwd_plh">
            <button onclick="handleRegister()" data-i18n="txt_reg_btn">注册</button>

    </div>
</div>

    <div class="menu-item" onclick="toggleSub(3)" data-i18n="m3">社区频道</div>
    <div class="submenu" id="sub3">

        <div class="submenu-item" onclick="renderPage('text-channel', this)" data-i18n="m3_2">文字频道</div>

        <div class="submenu-item" onclick="renderPage('wallet-manage', this)" data-i18n="m5_4">钱包管理</div>
        <div class="submenu-item" onclick="renderPage('bot-manage', this)" data-i18n="m5_5">量化Bot管理</div>
    </div>
</div>

function updateAll(){
    document.querySelectorAll('[data-i18n]').forEach(e=>e.innerText=i18n.t(e.getAttribute('data-i18n')));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=i18n.t(e.getAttribute('data-i18n-placeholder')));
}

function setLang(l){i18n.changeLanguage(l);updateAll();renderPage(currPage,currActiveEl);}

let currPage="trade-hall";let currActiveEl=null;

function toggleSub(n){
    document.querySelectorAll('.submenu').forEach(e=>e.classList.remove('show'));
    document.getElementById('sub'+n).classList.add('show');
    document.querySelectorAll('.menu-item').forEach(e=>e.classList.remove('active'));
    document.querySelectorAll('.menu-item')[n-1].classList.add('active');
}

        <label>${i18n.t('lang_select')}</label>
        <select onchange="setLang(this.value)">
            <option value="zh-CN" ${i18n.language=='zh-CN'?'selected':''}>中文</option>
            <option value="en" ${i18n.language=='en'?'selected':''}>English</option>
        </select>
        <p class="tip">${i18n.t('lang_tip')}</p>
        <button>${i18n.t('save')}</button></div>`;
    }
    if(page==="exchange-api"){
        h=`<div class="page-title">${i18n.t('m5_3')}</div><div class="card">
        <label>${i18n.t('exchange')}</label>
        <select><option>Binance</option><option>OKX</option></select>
        <label>${i18n.t('api_key')}</label>
        <input placeholder="${i18n.t('api_key')}">
        <label>${i18n.t('api_secret')}</label>
        <input placeholder="${i18n.t('api_secret')}">
        <button onclick="alert(i18n.t('api_check_ok'))">${i18n.t('save')}</button></div>`;
    }
    if(page==="wallet-manage"){
        h=`<div class="page-title">${i18n.t('m5_4')}</div><div class="card">
        <label>${i18n.t('chain_type')}</label>
        <select><option>ETH</option><option>TRON</option></select>
        <label>${i18n.t('wallet_addr')}</label>
        <input placeholder="0x...">
        <button>${i18n.t('bind_wallet')}</button></div>`;
    }
    if(page==="bot-manage"){
        h=`<div class="page-title">${i18n.t('m5_5')}</div><div class="card">
        <label>${i18n.t('bot_type')}</label>
        <select><option>${i18n.t('grid_strategy')}</option><option>${i18n.t('martingale')}</option></select>
        <label>${i18n.t('bot_status')}</label>
        <input value="Stopped" readonly>
        <button>${i18n.t('bot_start')}</button></div>`;
    }

    document.getElementById("mainContent").innerHTML=h;
    updateAll();
    if(page==="trade-hall")initTV("tv1","BINANCE:BTCUSDT");
    if(page==="crypto-market")initTV("tv2","BINANCE:ETHUSDT");
    if(page==="forex-metal")initTV("tv3","FX_IDC:XAUUSD");
    if(page==="future-market")initTV("tv4","CME:NQ1!");
    if(page==="kline-pro")initTV("tv5","NASDAQ:AAPL");
}

function initTV(id,s){new TradingView.widget({autosize:true,symbol:s,interval:"D",timezone:"Asia/Shanghai",theme:"dark",style:"1",locale:"zh",container_id:id});}
function copyWebhook(){const e=document.querySelector('input[value*="duckdns"]');e.select();document.execCommand("copy");alert(i18n.t("copy")+" OK");}
function switchTab(t){document.getElementById("loginForm").style.display=t=="login"?"block":"none";document.getElementById("registerForm").style.display=t=="login"?"none":"block";document.querySelectorAll(".tab-btn")[0].classList.toggle("active",t=="login");document.querySelectorAll(".tab-btn")[1].classList.toggle("active",t!="login");}
function handleLogin(){alert(i18n.t("login_ok"));document.getElementById("loginModal").style.display="none";}
function handleRegister(){alert(i18n.t("reg_ok"));switchTab("login");}
window.onload=()=>{updateAll();renderPage("trade-hall",document.querySelector(".submenu-item.active"));}
</script>
</body>
</html>
