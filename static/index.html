<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuantTalk - 量化交易社交平台</title>
<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{scrollbar-width:thin;scrollbar-color:#2d2d2d transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2d2d2d;border-radius:4px}
body{background:#1a1a1a;color:#dcddde;font-family:'Inter',sans-serif;margin:0;height:100vh;overflow:hidden}
.glass{background:rgba(15,20,25,.9);backdrop-filter:blur(12px);border:1px solid rgba(100,116,139,.1)}
.glass2{background:rgba(25,30,38,.7);border:1px solid rgba(100,116,139,.08)}
.tag{background:rgba(14,165,233,.12);color:#38bdf8;border:1px solid rgba(14,165,233,.2);border-radius:9999px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none;color:#fff}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#0284c7)}.btn-primary:hover{box-shadow:0 4px 14px rgba(14,165,233,.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#b9bbbe;border:1px solid #72767d}.btn-ghost:hover{color:#fff;border-color:#b9bbbe;background:rgba(79,84,92,.4)}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.25)}
.gain{color:#23a559}.loss{color:#ed4245}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}
.avatar-sm{width:24px;height:24px;font-size:10px}
.avatar-lg{width:56px;height:56px;font-size:22px}
.input{width:100%;background:#383842;border:1px solid #202225;border-radius:4px;padding:8px 12px;color:#dcddde;font-size:13px;outline:none;transition:border .2s}
.input:focus{border-color:#7289da;background:#404045}
.fade-in{animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#36393f;border:1px solid rgba(0,0,0,.2);border-radius:8px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;color:#dcddde}
.toast-wrap{position:fixed;top:70px;right:16px;z-index:200}
.toast{padding:10px 18px;border-radius:8px;color:#fff;font-size:13px;margin-bottom:8px;animation:fadeIn .2s}
.badge{position:absolute;top:-4px;right:-4px;background:#ed4245;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.divider{height:1px;background:rgba(79,84,92,.4);margin:8px 0}

/* ===== DISCORD LAYOUT ===== */
.discord-container{display:flex;height:100vh;overflow:hidden}

/* 服务器列表栏 (最左侧) */
.guilds-bar{width:72px;background:#1e1f22;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;overflow-y:auto}
.guild-icon{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .2s;background:#36393f;color:#fff;font-weight:600}
.guild-icon:hover{border-radius:16px}
.guild-icon.active{background:#5865f2;border-radius:16px}
.guild-icon.home{background:#5865f2}
.guild-divider{width:32px;height:2px;background:#202225;border-radius:1px}
.add-guild-btn{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:#23a559;color:#fff;transition:all .2s}
.add-guild-btn:hover{border-radius:16px;background:#2d8a4e}

/* 频道栏 */
.channels-bar{width:240px;background:#2b2d31;display:flex;flex-direction:column;overflow:hidden}
.channels-header{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #202225;font-weight:600;font-size:15px;background:#2b2d31;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.channels-list{flex:1;overflow-y:auto;padding:8px 8px}
.channel-group{margin-bottom:16px}
.channel-group-header{display:flex;align-items:center;padding:4px 8px;font-size:11px;font-weight:700;text-transform:uppercase;color:#939ba2;cursor:pointer;user-select:none}
.channel-group-header:hover{color:#dcddde}
.channel-item{display:flex;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;color:#b9bbbe;font-size:14px;transition:all .1s}
.channel-item:hover{background:rgba(79,84,92,.4);color:#dcddde}
.channel-item.active{background:rgba(79,84,92,.6);color:#fff}
.channel-item .ch-icon{margin-right:8px;font-size:16px}

/* 用户区域 */
.user-panel{height:52px;background:#232428;display:flex;align-items:center;padding:0 8px;gap:8px}
.user-panel .avatar{width:32px;height:32px;font-size:12px}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-status{font-size:11px;color:#b9bbbe}

/* 主内容区 */
.main-area{flex:1;display:flex;flex-direction:column;background:#313338;min-width:0}
.chat-header{height:48px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #3f4147;font-weight:600}
.chat-header .ch-hash{color:#6d6f78;font-size:24px}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.message{_display:flex;gap:16px;padding:4px 16px;border-radius:4px}
.message:hover{background:rgba(0,0,0,.1)}
.message .msg-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:#fff}
.message-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg-author{font-weight:600;color:#fff;font-size:14px}
.msg-time{font-size:10px;color:#72767d}
.msg-content{font-size:14px;color:#dbdee1;line-height:1.4}

/* 聊天输入区 */
.chat-input-area{padding:0 16px 24px;display:flex;gap:8px}
.chat-input{flex:1;background:#404045;border:1px solid #202225;border-radius:8px;padding:10px 14px;color:#dcddde;font-size:14px;resize:none;min-height:44px;max-height:200px}
.chat-input:focus{outline:none;border-color:#5865f2}
.chat-input::placeholder{color:#72767d}

/* 右侧面板 (成员列表) */
.right-panel{width:260px;background:#2b2d31;border-left:1px solid #202225;display:flex;flex-direction:column;overflow:hidden}
.right-panel-header{height:36px;padding:0 16px;display:flex;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;color:#939ba2}
.members-list{flex:1;overflow-y:auto;padding:8px}
.member-item{display:flex;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;color:#b9bbbe;font-size:13px;gap:8px}
.member-item:hover{background:rgba(79,84,92,.4);color:#dcddde}
.member-item .avatar{width:24px;height:24px;font-size:10px}
.member-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-badge{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.badge-owner{background:#f04747;color:#fff}
.badge-admin{background:#f04747;color:#fff}
.badge-mod{background:#43b581;color:#fff}

/* 交易大厅 */
.trading-selector{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#2b2d31;border-bottom:1px solid #202225}
.exchange-select{background:#383842;border:1px solid #202225;border-radius:4px;padding:6px 12px;color:#dcddde;font-size:13px;cursor:pointer;min-width:140px}
.exchange-select:focus{outline:none;border-color:#5865f2}
.symbol-input{background:#383842;border:1px solid #202225;border-radius:4px;padding:6px 12px;color:#dcddde;font-size:13px;width:100px}
.symbol-input:focus{outline:none;border-color:#5865f2}

/* K线图表容器 */
.kline-container{flex:1;padding:16px;min-height:400px}
.kline-controls{display:flex;gap:8px;margin-bottom:12px}
.kline-btn{padding:4px 12px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;background:#383842;color:#b9bbbe;border:1px solid #202225;transition:all .15s}
.kline-btn:hover{background:#404045;color:#fff}
.kline-btn.active{background:#5865f2;color:#fff;border-color:#5865f2}
.kline-chart{height:350px;border-radius:8px;overflow:hidden}

/* 行情面板 */
.quote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px}
.quote-card{background:#36393f;border-radius:8px;padding:16px;transition:all .2s}
.quote-card:hover{background:#404045;transform:translateY(-2px)}
.quote-symbol{font-weight:600;font-size:16px;color:#fff}
.quote-price{font-size:24px;font-weight:700;margin:4px 0}
.quote-change{font-size:13px;font-weight:500}

/* 模态框样式覆盖 */
.modal h3{color:#fff;font-size:18px;font-weight:600}
.modal input,.modal select,.modal textarea{background:#404045;border-color:#202225;color:#dcddde}
.modal input:focus,.modal textarea:focus{border-color:#5865f2}
</style>
</head>
<body>

<!-- 整体容器 (Discord风格) -->
<div id="app-container" class="discord-container">
    <!-- 左侧：服务器列表 -->
    <div class="guilds-bar" id="guilds-bar">

    </div>

    <!-- 中间：频道栏 + 主内容 -->
    <div id="main-column" style="display:flex;flex:1;min-width:0">
        <!-- 频道栏 -->
        <div class="channels-bar" id="channels-bar">
            <div class="channels-header">
                <span id="current-server-name">QuantTalk</span>
            </div>
            <div class="channels-list" id="channels-list">

            <div class="user-panel">

                <!-- 动态加载内容 -->
            </div>

    <!-- 右侧：成员列表 -->

</div>

<!-- MODAL -->
<div id="modal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal fade-in" id="modal-body"></div>
</div>
<!-- TOASTS -->
<div class="toast-wrap" id="toasts"></div>

<script>
const S={token:localStorage.getItem('qt_token')||'',user:JSON.parse(localStorage.getItem('qt_user')||'null'),page:'home',ws:null,channelId:null,guildId:null};
const A='/api';

// ===== UTILS =====
async function api(p,o={}){
const h={...(o.headers||{})};
if(!h['Content-Type'] && !(o.body instanceof FormData)){
h['Content-Type']='application/json';
}
if(o.body instanceof FormData && !h['Content-Type']){
delete h['Content-Type'];
}
if(S.token)h.Authorization='Bearer '+S.token;
const r=await fetch(A+p,{...o,headers:h});
if(r.status===401&&!p.includes('/auth/')){doLogout();return null}
return r.json();
}
function toast(msg,type='info'){const c={info:'#5865f2',success:'#23a559',error:'#ed4245'};const d=document.createElement('div');d.className='toast';d.style.background=c[type]||c.info;d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ===== NAV =====
function nav(id){
S.page=id;
renderPage();
}

// ===== PAGE ROUTER =====
function renderPage(){
const content=document.getElementById('main-content');
const title=document.getElementById('main-header-title');
document.getElementById('right-panel').style.display='none';

switch(S.page){
case 'home':title.textContent='🏠 首页';renderHome();break;
case 'trading':title.textContent='📊 交易大厅';renderTradingFloor();break;
case 'market':title.textContent='📈 行情';renderMarket();break;
case 'crypto':title.textContent='🪙 加密货币';renderCrypto();break;
case 'forex':title.textContent='💱 外汇贵金属';renderForex();break;
case 'kline':title.textContent='📊 K线分析';renderKline();break;
case 'chat':title.textContent='💬 聊天室';renderChat();break;
case 'friends':title.textContent='👥 好友';renderFriends();break;
case 'messages':title.textContent='💬 私信';renderMessages();break;
case 'groups':title.textContent='👥 群聊';renderGroups();break;
case 'portfolio':title.textContent='📜 成绩单';renderPortfolio();break;
case 'profile':title.textContent='👤 个人主页';renderProfile();break;
case 'wallet':title.textContent='💰 我的钱包';renderWallet();break;
default:title.textContent='🏠 首页';renderHome();
}
}

// ===== HOME PAGE =====
function renderHome(){
const content=document.getElementById('main-content');
if(!S.user){
content.innerHTML=`
<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;color:#b9bbbe">
<div style="font-size:72px;margin-bottom:24px">⚡</div>
<h1 style="font-size:32px;font-weight:700;color:#fff;margin-bottom:8px">QuantTalk</h1>
<p style="font-size:16px;margin-bottom:32px">量化交易社交平台 — 连接全球交易者</p>
<div style="display:flex;gap:12px">
<button onclick="showAuth('login')" class="btn btn-primary">登录</button>
<button onclick="showAuth('register')" class="btn btn-ghost">注册</button>
</div>
</div>`;
return;
}

// 快速导航卡片
content.innerHTML=`
<div style="padding:24px">
<h2 style="font-size:20px;font-weight:600;color:#fff;margin-bottom:20px">⚡ 欢迎回来，${S.user.username}</h2>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px">
<div class="quote-card" onclick="nav('trading')" style="cursor:pointer">
<div style="font-size:24px;margin-bottom:12px">📊</div>
<div style="font-weight:600;color:#fff;font-size:16px">交易大厅</div>
<div style="color:#b9bbbe;font-size:13px;margin-top:4px">MT4/MT5/交易所实时行情</div>
</div>
<div class="quote-card" onclick="nav('market')" style="cursor:pointer">
<div style="font-size:24px;margin-bottom:12px">📈</div>
<div style="font-weight:600;color:#fff;font-size:16px">行情分析</div>
<div style="color:#b9bbbe;font-size:13px;margin-top:4px">股票、指数、期货</div>
</div>
<div class="quote-card" onclick="nav('crypto')" style="cursor:pointer">
<div style="font-size:24px;margin-bottom:12px">🪙</div>
<div style="font-weight:600;color:#fff;font-size:16px">加密货币</div>
<div style="color:#b9bbbe;font-size:13px;margin-top:4px">BTC、ETH等主流币种</div>
</div>
<div class="quote-card" onclick="nav('kline')" style="cursor:pointer">
<div style="font-size:24px;margin-bottom:12px">📊</div>
<div style="font-weight:600;color:#fff;font-size:16px">K线分析</div>
<div style="color:#b9bbbe;font-size:13px;margin-top:4px">自定义K线图表</div>
</div>
<div class="quote-card" onclick="nav('forex')" style="cursor:pointer">
<div style="font-size:24px;margin-bottom:12px">💱</div>

<div style="color:#b9bbbe;font-size:13px;margin-top:4px">EUR/USD、黄金、白银</div>
</div>
<div class="quote-card" onclick="nav('chat')" style="cursor:pointer">
<div style="font-size:24px;margin-bottom:12px">💬</div>

</div>
</div>

<h3 style="font-size:16px;font-weight:600;color:#fff;margin-bottom:12px">📰 最新动态</h3>
<div id="home-feed" style="color:#b9bbbe">加载中...</div>
</div>`;
loadHomeFeed();
}

async function loadHomeFeed(){
try{
const posts=await api('/posts?limit=5');
const el=document.getElementById('home-feed');
if(posts&&posts.length){
el.innerHTML=posts.map(p=>`
<div style="padding:12px;background:#36393f;border-radius:8px;margin-bottom:8px">
<div style="font-weight:600;color:#fff">${esc(p.author?.username||'匿名')}</div>
<div style="margin-top:4px">${esc(p.content||'').substring(0,100)}...</div>
<div style="font-size:11px;color:#72767d;margin-top:8px">${timeAgo(p.created_at)}</div>
</div>`).join('');
}else{
el.innerHTML='<p>暂无动态，快来发布第一条吧！</p>';
}
}catch(e){
document.getElementById('home-feed').innerHTML='<p>加载失败</p>';
}
}

function onExchangeChange(){
const exchange=document.getElementById('exchange-select').value;
const symbolSelect=document.getElementById('symbol-select');
const symbols={
mt4:['EURUSD','GBPUSD','USDJPY','XAUUSD','GBPJPY','AUDUSD'],
mt5:['EURUSD','GBPUSD','USDJPY','XAUUSD','GBPJPY','AUDUSD','USDCAD','NZDUSD'],

let S_klineChart=null;
async function loadTradingChart(){
const exchange=document.getElementById('exchange-select').value;
const symbol=document.getElementById('symbol-select').value;
const period=S.klinePeriod||'1h';

const chartEl=document.getElementById('kline-chart');
if(!chartEl)return;

if(S_klineChart){S_klineChart.remove();S_klineChart=null;}
try{
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{type:'solid',color:'#36393f'},textColor:'#b9bbbe'},grid:{vertLines:{color:'#404045'},horzLines:{color:'#404045'}},width:chartEl.clientWidth,height:380});
S_klineChart=chart;

const candleSeries=chart.addCandlestickSeries({upColor:'#23a559',downColor:'#ed4245',borderVisible:false});
const res=await api(`/market/kline/${symbol}?period=${period}&limit=200`);
if(res&&res.length){
candleSeries.setData(res.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
chart.timeScale().fitContent();
}else{
const now=Math.floor(Date.now()/1000);
const data=generateMockKline(symbol,now,200);
candleSeries.setData(data);
chart.timeScale().fitContent();
}

// 更新价格
const last=res?.[res.length-1];
if(last){
document.getElementById('current-price').textContent=last.close?.toFixed(5)||'--';
const change=last.close-last.open;
const pct=((change/last.open)*100).toFixed(2);
document.getElementById('price-change').innerHTML=`<span class="${change>=0?'gain':'loss'}">${change>=0?'+':''}${change.toFixed(5)} (${pct}%)</span>`;
}
}catch(e){
console.error('K线加载失败:',e);
}
}

function generateMockKline(symbol,now,count){
const data=[];
let price=symbol.includes('BTC')?45000:symbol.includes('XAU')?2000:1.1;
for(let i=count;i>=0;i--){
const t=now-i*3600;
const o=price;
price*=(1+(Math.random()-0.5)*0.01);
const h=Math.max(o,price)*(1+Math.random()*0.002);
const l=Math.min(o,price)*(1-Math.random()*0.002);
const c=price;
data.push({time:t,open:o,high:h,low:l,close:c});
}
return data;
}

<div style="text-align:center"><div style="font-size:18px;font-weight:600 ${r.total_return>=0?'color:#23a559':'color:#ed4245'}">${r.total_return>=0?'+':''}${r.total_return?.toFixed(1)}%</div><div style="font-size:10px;color:#939ba2">收益率</div></div>
</div>
<div style="display:flex;gap:8px">
<button onclick="likeReport(${r.id})" class="btn btn-ghost" style="padding:4px 12px;font-size:12px">❤️ ${r.likes_count||0}</button>
<button onclick="viewReport(${r.id})" class="btn btn-primary" style="padding:4px 12px;font-size:12px">查看详情</button>
</div>
</div>`).join('')}</div>`;
}else{
el.innerHTML='<p style="color:#72767d;text-align:center;padding:40px">暂无回测报告</p>';
}
}catch(e){
document.getElementById('portfolio-content').innerHTML='<p>加载失败</p>';
}
}

async function addReport(e){
e.preventDefault();
const fd=new FormData(e.target);
const data={
name:fd.get('name'),
strategy_name:fd.get('strategy_name'),
symbol:fd.get('symbol'),
period:'1h',
start_date:new Date(Date.now()-30*24*3600*1000).toISOString().split('T')[0],
end_date:new Date().toISOString().split('T')[0],
total_trades:parseInt(fd.get('total_trades')),
win_rate:parseFloat(fd.get('win_rate')),
profit_factor:parseFloat(fd.get('profit_factor')),
max_drawdown:parseFloat(fd.get('max_drawdown')),
total_return:parseFloat(fd.get('total_return')),
is_public:fd.get('is_public')==='on'
};
const res=await api('/portfolio/reports',{method:'POST',body:JSON.stringify(data)});
if(res?.id){closeModal();toast('回测报告已发布！','success');renderPortfolio();}
else{toast(res?.detail||'发布失败','error');}
}
